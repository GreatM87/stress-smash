<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘 부수고 자기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F0EA; --surface:#FBFAF7; --ink:#1D2130; --muted:#767887; --hair:#DCD7CE;
  --gold:#A9843A; --gold-soft:#EFE4CC; --sel:#1D2130; --on-sel:#FBFAF7;
  --m5:#D9B45E; --m4:#8FB3A0; --m3:#AFA9C2; --m2:#C4907F; --m1:#5F6987;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1118; --surface:#161A24; --ink:#ECE8E1; --muted:#8F92A1; --hair:#2A2F3C;
    --gold:#D9B56A; --gold-soft:#2C2719; --sel:#ECE8E1; --on-sel:#0E1118; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1118; --surface:#161A24; --ink:#ECE8E1; --muted:#8F92A1; --hair:#2A2F3C;
  --gold:#D9B56A; --gold-soft:#2C2719; --sel:#ECE8E1; --on-sel:#0E1118; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6;letter-spacing:-.005em;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.wrap{max-width:500px;margin:0 auto;padding:26px 20px 80px}
.serif{font-family:"Gowun Batang",serif}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{font-family:"Gowun Batang",serif;font-weight:700;font-size:1.35rem;margin:0;letter-spacing:-.01em}
.date{color:var(--muted);font-size:.85rem;margin:0}
h2{font-family:"Gowun Batang",serif;font-weight:700;font-size:1.45rem;line-height:1.35;margin:0 0 6px;letter-spacing:-.01em}
.lead{color:var(--muted);font-size:.9rem;margin:0 0 20px}
h3{font-size:.8rem;font-weight:500;letter-spacing:.06em;color:var(--muted);margin:20px 0 10px}
button{font:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible,input:focus-visible,.rock:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:18px;margin-bottom:14px}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:.92rem;margin:0}

.nav{display:flex;gap:22px;border-bottom:1px solid var(--hair);margin:0 0 24px}
.nav button{border:none;background:none;padding:0 0 10px;font-size:.95rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.nav button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}

.primary{width:100%;font-size:1rem;font-weight:500;padding:15px;border:none;border-radius:12px;background:var(--sel);color:var(--on-sel);letter-spacing:.01em}
.primary:active{opacity:.85}
.row{display:flex;gap:12px;align-items:center;margin-top:24px}
.row .primary{flex:1}
.back{border:none;background:none;color:var(--muted);padding:12px 4px;font-size:.92rem}
.linkbtn{border:none;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px 0;font-size:.88rem}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:1px solid var(--hair);border-radius:10px;background:var(--surface);font-size:.92rem;line-height:1.35;transition:background .15s,color .15s,border-color .15s}
.chip.on{background:var(--sel);color:var(--on-sel);border-color:var(--sel)}
.chip.done{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.chip.done::before{content:"✓ ";color:var(--gold)}
.chip.ghost{border-style:dashed;color:var(--muted);background:transparent}
.chip.sm{padding:5px 10px;font-size:.84rem}
.chip.static{cursor:default}
.chip.plan{border-color:var(--gold)}
.tabs{display:flex;gap:18px;overflow-x:auto;margin:0 0 14px;scrollbar-width:none;border-bottom:1px solid var(--hair)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:0 0 8px;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--muted);font-size:.9rem}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.picked{margin:0 0 16px;font-size:.88rem;color:var(--muted)}
.picked b{color:var(--ink);font-weight:500}
.own{display:flex;gap:8px;margin-top:12px}
.own input,.memo{flex:1;min-width:0;border:1px solid var(--hair);border-radius:10px;padding:11px 12px;font:inherit;background:var(--surface);color:var(--ink)}
.own button{padding:9px 16px;border:none;border-radius:10px;background:var(--sel);color:var(--on-sel)}
.memo{width:100%}

.progress{height:2px;background:var(--hair);margin:0 0 26px;border-radius:1px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);transition:width .4s}
.moods{display:flex;flex-direction:column;gap:8px}
.mood{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--hair);border-radius:12px;background:var(--surface);font-size:1rem;text-align:left}
.mood .dot{width:14px;height:14px;border-radius:50%;flex:none}
.mood.on{border-color:var(--ink)}

/* scene */
.scene{position:relative;border-radius:20px;overflow:hidden;min-height:310px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:56px 14px 0;margin-bottom:16px;
  background:radial-gradient(120% 80% at 50% 0%, #252B3D 0%, #141826 60%, #0D1019 100%);color:#ECE8E1}
.scene .say{position:absolute;top:18px;left:18px;right:18px;margin:0;text-align:center;font-family:"Gowun Batang",serif;font-size:.98rem;color:rgba(236,232,225,.82)}
.moon{position:absolute;top:58px;right:34px;width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle at 38% 36%, #FFF6DD 0%, #F0D79A 55%, #C9A75E 100%);
  box-shadow:0 0 30px 8px rgba(240,215,154,.35),0 0 90px 30px rgba(240,215,154,.12);transition:filter 1.2s ease, box-shadow 1.2s ease, opacity 1.2s}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(1px 1px at 12% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 28% 12%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 46% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 64% 16%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 8% 48%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 88% 44%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 22% 38%,#fff 50%,transparent 51%)}
.stack{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%}
.horizon{position:relative;z-index:1;width:calc(100% + 28px);height:34px;background:linear-gradient(#1B2030,#10131C);border-top:1px solid rgba(236,232,225,.14);margin-top:-2px}
.rock{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 20px;margin-top:-8px;color:rgba(240,236,228,.92);font-size:.86rem;font-weight:500;letter-spacing:.01em;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere;line-height:1.35;
}
.rock.l1{width:min(54%,210px);min-height:56px}
.rock.l2{width:min(68%,270px);min-height:68px}
.rock.l3{width:min(82%,320px);min-height:80px}
.rock .shape{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;filter:drop-shadow(0 8px 9px rgba(0,0,0,.45));transition:filter .4s}
.rock.glass span{color:#15202C;text-shadow:0 1px 1px rgba(255,255,255,.35)}
.rock.small{width:min(44%,170px);min-height:42px;font-size:.78rem;cursor:default}
.rock:nth-child(odd){transform:rotate(-1.5deg)} .rock:nth-child(even){transform:rotate(2deg) translateX(5px)}
.rock.sel .shape{filter:drop-shadow(0 8px 9px rgba(0,0,0,.45)) drop-shadow(0 0 1.5px rgba(236,232,225,.95))}
.rock.ready .shape{filter:drop-shadow(0 0 2px rgba(217,181,106,.95)) drop-shadow(0 0 12px rgba(217,181,106,.55))}
.rock.wob{animation:wob .3s}
@keyframes wob{0%,100%{translate:0 0}25%{translate:-3px 0}75%{translate:3px 0}}
.rock.hit{animation:hit .14s}
@keyframes hit{0%{translate:0 0}40%{translate:-3px 2px}70%{translate:2px -1px}100%{translate:0 0}}
.rock span{position:relative;z-index:2;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.rock svg.ck{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible;filter:drop-shadow(0 0 2.5px rgba(232,198,120,.9))}
.rock svg.ck path{fill:none;stroke:#E8C678;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.caption{position:absolute;left:0;right:0;bottom:46px;z-index:3;text-align:center;font-family:"Gowun Batang",serif;color:#F0D79A;font-size:1.05rem;opacity:0;pointer-events:none}
.caption.go{animation:cap 1.8s ease forwards}
@keyframes cap{0%{opacity:0;transform:translateY(6px)}20%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.drift{animation:drift 6s ease-in-out infinite}
@keyframes drift{0%,100%{translate:0 0}50%{translate:0 -3px}}

/* panel */
.panel h4{font-family:"Gowun Batang",serif;font-size:1.15rem;margin:0 0 4px}
.bar{height:3px;background:var(--hair);border-radius:2px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.note{font-size:.84rem;color:var(--muted);margin:0}
.callout{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--gold-soft);border:1px solid var(--gold);font-size:.9rem}
.plan{margin:10px 0 0;font-size:.86rem;color:var(--gold)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)}
.carrybox{margin-top:12px}

/* summary */
.sumhead{display:flex;align-items:center;gap:12px}
.sumhead .dot{width:18px;height:18px;border-radius:50%;flex:none}
.sumhead b{font-family:"Gowun Batang",serif;font-size:1.15rem}
.memoq{font-family:"Gowun Batang",serif;color:var(--muted);margin:8px 0 0}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calhead b{font-family:"Gowun Batang",serif;font-size:1.1rem}
.calhead button{border:1px solid var(--hair);background:transparent;border-radius:8px;width:36px;height:32px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .wd{font-size:.74rem;color:var(--muted);padding-bottom:4px}
.cal button{aspect-ratio:1;border:none;border-radius:50%;background:transparent;font-size:.82rem;padding:0;color:var(--muted);position:relative}
.cal button.has{color:#1D2130;font-weight:500}
.cal button.today::after{content:"";position:absolute;inset:-3px;border:1px solid var(--gold);border-radius:50%}
.cal button.sel{box-shadow:0 0 0 2px var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%}

/* stats */
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:10px;padding:3px;margin:0 0 16px}
.seg button{padding:6px 16px;border:none;border-radius:8px;background:transparent;font-size:.86rem;color:var(--muted)}
.seg button.on{background:var(--sel);color:var(--on-sel)}
.sumgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.sum{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:14px 16px}
.sum b{display:block;font-family:"Gowun Batang",serif;font-size:1.55rem;line-height:1.2}
.sum span{font-size:.8rem;color:var(--muted)}
.sum .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
.stat{display:grid;grid-template-columns:5.4em 1fr 1.8em;align-items:center;gap:10px;margin-bottom:10px;font-size:.88rem}
.stat .track{height:6px;background:var(--hair);border-radius:3px;overflow:hidden}
.stat .track i{display:block;height:100%;background:var(--gold);border-radius:3px}
.stat .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.rank{margin:0;padding:0;list-style:none;counter-reset:r}
.rank li{counter-increment:r;display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--hair);font-size:.92rem}
.rank li:last-child{border-bottom:none}
.rank li::before{content:counter(r);font-family:"Gowun Batang",serif;color:var(--gold);width:1em}
.rank li span{margin-left:auto;color:var(--muted);font-size:.82rem}
.insight{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--hair);font-family:"Gowun Batang",serif;font-size:.98rem}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px}
.days div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:.76rem;color:var(--muted)}
.days i{width:14px;border-radius:7px;min-height:4px}
.help{font-size:.78rem;color:var(--muted);margin-top:34px;line-height:1.6}

/* breathe */
.ov{position:fixed;inset:0;z-index:70;background:radial-gradient(120% 80% at 50% 20%, #1E2333 0%, #0D1019 100%);color:#ECE8E1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:24px;text-align:center}
.ov[hidden]{display:none}
.ov p{margin:0;font-family:"Gowun Batang",serif;font-size:1.1rem}
.ring{width:190px;height:190px;border-radius:50%;border:1px solid rgba(232,198,120,.7);box-shadow:0 0 40px rgba(232,198,120,.2) inset,0 0 40px rgba(232,198,120,.15);transform:scale(.5)}
.ring.in{transition:transform 4s ease-in-out;transform:scale(1)}
.ring.out{transition:transform 6s ease-in-out;transform:scale(.5)}
.ov button{border:1px solid rgba(236,232,225,.3);background:transparent;color:#ECE8E1;border-radius:10px;padding:10px 18px;font-size:.9rem}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.rock.hit,.rock.wob,.drift{animation:none}.caption.go{animation-duration:.01s}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="ov" id="breathe" hidden role="dialog" aria-modal="true" aria-label="숨 고르기">
  <p>1분 숨 고르기</p>
  <div class="ring" id="ring"></div>
  <p id="bText" style="font-size:.95rem;opacity:.8">원을 따라 천천히</p>
  <button id="bSkip" type="button">그만할래요</button>
</div>
<main class="wrap">
  <header><h1>오늘 부수고 자기</h1><p class="date" id="date"></p></header>
  <nav class="nav" aria-label="메뉴">
    <button type="button" class="on" data-view="today" aria-pressed="true">오늘</button>
    <button type="button" data-view="cal" aria-pressed="false">기록</button>
    <button type="button" data-view="stats" aria-pressed="false">통계</button>
  </nav>
  <section id="vToday"></section>
  <section id="vCal" hidden></section>
  <section id="vStats" hidden></section>
  <p class="help">많이 힘든 날엔 혼자 버티지 말고 믿는 사람이나 전문가와 이야기해 보세요.<br>자살예방상담전화 109 · 정신건강위기상담 1577-0199</p>
</main>

<script>
(() => {
// ================= data =================
const MOODS = [
  {v:5, name:"아주 좋았어", c:"var(--m5)"},
  {v:4, name:"좋았어", c:"var(--m4)"},
  {v:3, name:"그럭저럭", c:"var(--m3)"},
  {v:2, name:"별로였어", c:"var(--m2)"},
  {v:1, name:"힘들었어", c:"var(--m1)"}
];
const MOOD = Object.fromEntries(MOODS.map(m=>[m.v,m]));
const DID = ["일했어","공부했어","운동했어","산책했어","친구 만났어","가족이랑 보냈어","데이트했어","집안일 했어","푹 쉬었어","취미 생활","맛있는 거 먹었어","영상·게임","늦잠 잤어","야근했어","병원 다녀왔어","쇼핑했어"];
const CATS = [
 {id:"work", name:"일·공부", s:{
  "마감이 코앞":["뼈대만 먼저 잡았어","쉬운 부분부터 조금 했어","기한 조정을 물어봤어","내일 할 분량을 정했어"],
  "할 일이 너무 많아":["할 일을 다 적어봤어","꼭 할 3개만 골랐어","안 해도 될 일을 지웠어"],
  "발표·시험":["한 번 연습해봤어","예상 질문을 적어봤어","일찍 자기로 했어"],
  "실수했어":["바로잡을 걸 하나 했어","관련된 사람에게 알렸어","다음엔 어떻게 할지 정했어"],
  "일이 손에 안 잡혀":["15분만 해보자며 시작했어","자리를 정리했어","휴대폰을 멀리 뒀어"],
  "회의가 많았어":["회의 사이에 잠깐 쉬었어","내일 일정을 정리했어","불필요한 회의를 줄여봤어"]}},
 {id:"rel", name:"관계", s:{
  "눈치 보이는 사람":["바꿀 수 있는 것만 구분했어","할 말을 짧게 정리했어","믿는 사람에게 얘기했어"],
  "서운한 일":["서운한 점을 한 문장으로 적었어","말할지 넘길지 정했어","한발 물러서 생각해봤어"],
  "다퉜어":["먼저 마음을 가라앉혔어","상대 입장도 생각해봤어","먼저 연락해봤어"],
  "연락이 부담돼":["답장을 미뤄도 된다고 정했어","짧게라도 답했어","알림을 잠시 껐어"],
  "외로웠어":["편한 사람에게 연락했어","밖에 나가 걸었어","좋아하는 걸 했어"],
  "무례한 사람":["내 잘못이 아니라고 정리했어","거리를 두기로 했어","누군가에게 털어놨어"]}},
 {id:"body", name:"몸·컨디션", s:{
  "잠을 못 잤어":["잠깐 낮잠을 잤어","오늘 일찍 눕기로 했어","오후 카페인을 끊었어"],
  "너무 피곤해":["물을 충분히 마셨어","잠깐 걸었어","할 일을 하나 덜어냈어"],
  "몸이 안 좋아":["쉬어도 된다고 허락했어","병원·약을 챙겼어","따뜻한 걸 먹었어"],
  "운동을 못 했어":["짧게 스트레칭했어","계단으로 다녔어","내일 운동 시간을 정했어"],
  "과식했어":["가볍게 산책했어","나를 탓하지 않기로 했어","내일 식사를 미리 정했어"]}},
 {id:"money", name:"돈", s:{
  "카드값·지출":["이번 달 지출을 확인했어","줄일 항목을 하나 정했어","장바구니를 비웠어"],
  "수입 걱정":["고정 지출을 적어봤어","필요한 금액을 숫자로 정했어","상의할 사람을 찾아봤어"],

// ================= visuals =================
function rng(seed){ let h=2166136261; for(const c of seed){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%10000)/10000; }; }
function cracks(id){ const r=rng(id), out=[]; for(let i=0;i<9;i++){ let x=35+r()*30,y=35+r()*30,a=r()*Math.PI*2,d=`M${x.toFixed(1)} ${y.toFixed(1)}`; const n=3+Math.floor(r()*3); for(let k=0;k<n;k++){ a+=(r()-.5)*1.1; const L=8+r()*12; x+=Math.cos(a)*L; y+=Math.sin(a)*L; d+=` L${x.toFixed(1)} ${y.toFixed(1)}`; } out.push(d); } return out; }
const lvOf = t => 1 + Math.floor(rng(t)()*3);
const PAL = {facet:["#2B2F39","#7C8290"], glass:["#6F889E","#DCE8F0"]};
const PARTC = {facet:["#6E7482","#454A57","#2E323C"], glass:["#C9DAE6","#9DB4C8","#7F98AE"], pebble:["#827B73","#6E6861","#4E4A45"]};
function mix(a,b,t){ const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)); const A=p(a),B=p(b); return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join(""); }
function styleOf(){ const m = draft && draft.mood; return m && m<=2 ? "glass" : "facet"; }
function rockShape(id, style){
  const r = rng(id+style);
  const open = `<svg class="shape" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">`;
  if(style==="pebble"){
    const cx = 50+(r()-.5)*4, rx = 47-r()*3, ry = 16+r()*2.5;
    return open + `<ellipse cx="${cx}" cy="22" rx="${rx}" ry="${ry}" fill="#4B4742"/><ellipse cx="${cx-1}" cy="19.5" rx="${rx-4}" ry="${ry-3.5}" fill="#6A645D"/><ellipse cx="${cx-3}" cy="17" rx="${rx-14}" ry="${ry-8}" fill="#7F7870"/><ellipse cx="${cx-16+r()*4}" cy="10.5" rx="${9+r()*5}" ry="2.4" fill="#A49D93" opacity=".75"/></svg>`;
  }
  const glass = style==="glass", n = glass ? 7 : 9, pts = [];
  for(let i=0;i<n;i++){
    const a = i/n*Math.PI*2 + (r()-.5)*0.5;
    const k = glass ? (i%2 ? 0.72+r()*0.12 : 0.95+r()*0.08) : 0.9+r()*0.12;
    let x = 50 + Math.cos(a)*48*k, y = 21 + Math.sin(a)*(glass?21:18)*k;
    y = Math.min(39.5, Math.max(glass?0.5:2, y)); x = Math.min(99.5, Math.max(0.5, x));
    pts.push([x,y]);
  }
  const C = [44+r()*12, 14+r()*8], [lo,hi] = PAL[style];
  let s = "", lines = "";
  for(let i=0;i<n;i++){
    const a = pts[i], b = pts[(i+1)%n], mx = (a[0]+b[0])/2-C[0], my = ((a[1]+b[1])/2-C[1])*2.4, L = Math.hypot(mx,my)||1;
    let t = 0.5 + 0.5*((mx/L)*-0.6 + (my/L)*-0.8) + (r()-.5)*0.18; t = Math.min(1, Math.max(0, t));
    s += `<polygon points="${C[0].toFixed(1)},${C[1].toFixed(1)} ${a[0].toFixed(1)},${a[1].toFixed(1)} ${b[0].toFixed(1)},${b[1].toFixed(1)}" fill="${mix(lo,hi,t)}"${glass?' opacity=".93"':""}/>`;
    lines += `<line x1="${C[0].toFixed(1)}" y1="${C[1].toFixed(1)}" x2="${a[0].toFixed(1)}" y2="${a[1].toFixed(1)}"/>`;
  }
  const edge = glass ? `stroke="#EEF5FA" stroke-opacity=".75" stroke-width=".7"` : `stroke="#ffffff" stroke-opacity=".07" stroke-width=".6"`;
  return open + s + `<g ${edge} vector-effect="non-scaling-stroke" style="vector-effect:non-scaling-stroke">${lines}</g>` + (glass ? `<polygon points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="#EEF5FA" stroke-opacity=".55" stroke-width=".7" style="vector-effect:non-scaling-stroke"/>` : "") + `</svg>`;
}
function smallRock(c, style){ return `<div class="rock small l${lvOf(c.text)}${style==="glass"?" glass":""}">${rockShape(c.text, style)}<span>${esc(c.text)}</span></div>`; }
function moonStyle(load){ const dim = Math.min(load*0.16, 0.7); return `filter:brightness(${1-dim}) saturate(${1-dim*0.6});opacity:${1-dim*0.5}`; }
function sceneHTML(say, rocksHTML, load, extra=""){

    <div class="stack" id="stack">${rocksHTML}</div><div class="horizon"></div><div class="caption" id="caption"></div>${extra}</div>`;

let step = -1, draft = null, tab = "work", ownOpen = false, rocks = [], sel = null, carryOpen = false;

      <div class="moods">${MOODS.map(m=>`<button class="mood${draft.mood===m.v?" on":""}" data-m="${m.v}" type="button"><span class="dot" style="background:${m.c}"></span>${m.name}</button>`).join("")}</div>`;

  }

      <div class="chips">${DID.map(d=>`<button class="chip${draft.did.includes(d)?" on":""}" data-d="${esc(d)}" type="button" aria-pressed="${draft.did.includes(d)}">${esc(d)}</button>`).join("")}</div>
      <div class="row"><button class="back" id="prev" type="button">이전</button><button class="primary" id="next" type="button">다음</button></div>`;

    $("prev").onclick = () => { step = 0; renderToday(); }; $("next").onclick = () => { step = 2; renderToday(); };

  else if(step === 3){
    el.innerHTML = progress() + `<h2>오늘 잘한 것</h2><p class="lead">작은 것이라도 괜찮아요</p>
      <div class="chips">${GOOD.map(d=>`<button class="chip${draft.good.includes(d)?" on":""}" data-g="${esc(d)}" type="button" aria-pressed="${draft.good.includes(d)}">${esc(d)}</button>`).join("")}</div>
      <div class="row"><button class="back" id="prev" type="button">이전</button><button class="primary" id="next" type="button">${draft.stress.length ? "바위 내려놓으러 가기" : "다음"}</button></div>`;
    el.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { toggle(draft.good, b.dataset.g); b.classList.toggle("on"); b.setAttribute("aria-pressed", b.classList.contains("on")); });
    $("prev").onclick = () => { step = 2; renderToday(); };
    $("next").onclick = () => {

      <button class="primary" id="fin" type="button">잘 자요</button>`;
    $("fin").onclick = () => { const d = S.days[todayKey()]; if(d){ d.memo = $("memo").value.trim(); save(); } step = -1; renderToday(); };

function toggle(arr, v){ const i = arr.indexOf(v); i<0 ? arr.push(v) : arr.splice(i,1); }
function hasStress(c,t){ return draft.stress.some(s=>s.cat===c && s.text===t); }
function renderStressStep(el){

// ---------- ritual ----------
const isReady = r => r.acts.length >= NEED;
const crackN = r => Math.min(9, Math.round(Math.min(r.acts.length,NEED)/NEED*6) + r.hits);
function renderRitual(el){
  const left = rocks.filter(r=>!r.fate);
  if(!left.length){ finishDay(); return; }
  if(!left.some(r=>r.id===sel)){ sel = left[0].id; carryOpen = false; }
  const r = rocks.find(x=>x.id===sel);
  const load = left.reduce((a,x)=>a + (isReady(x)?0.4:1), 0);
  el.innerHTML = progress() + sceneHTML("오늘 해본 것만큼 금이 가요", "", load) + `<div class="card panel" id="panel"></div><button class="primary" id="smashAll" type="button">남은 바위 한 번에 깨기 · ${left.length}개</button><button class="back" id="prev" type="button">이전</button>`;
  const stack = $("stack"), style = styleOf();
  left.forEach(x => {
    const lv = lvOf(x.text), b = document.createElement("div");
    b.className = `rock l${lv}${style==="glass"?" glass":""}${x.id===sel?" sel":""}${isReady(x)?" ready":""}`;
    b.tabIndex = 0; b.setAttribute("role","button"); b.setAttribute("aria-label", `${x.text}${isReady(x)?", 깰 준비가 됐어요":""}`);
    b.innerHTML = rockShape(x.id, style) + `<svg class="ck" viewBox="0 0 100 100" preserveAspectRatio="none">${cracks(x.id).slice(0,crackN(x)).map(d=>`<path d="${d}"/>`).join("")}</svg><span>${esc(x.text)}</span>`;
    b.addEventListener("pointerdown", e => { e.preventDefault(); tapRock(x, b, e.clientX, e.clientY, lv); });
    b.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); const q=b.getBoundingClientRect(); tapRock(x,b,q.left+q.width/2,q.top+q.height/2,lv); } });
    stack.appendChild(b);
  });
  renderPanel(r);
  $("prev").onclick = () => { step = 3; renderToday(); };
  $("smashAll").onclick = () => {
    const els = [...stack.children];
    $("smashAll").disabled = true; $("prev").disabled = true;
    $("scene").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
    const gap = reduce ? 0 : 160, lead = reduce ? 0 : 350;
    left.forEach((x,i) => { x.fate = "smashed"; setTimeout(() => shatter(els[i], lvOf(x.text)), lead + i*gap); });
    setTimeout(() => caption(left.length > 1 ? "전부 내려놓았어요" : "내려놓았어요"), lead);
    setTimeout(() => renderToday(), reduce ? 200 : lead + left.length*gap + 1100);
  };
}
function renderPanel(r){
  const p = $("panel"), acts = actsFor(r), plan = r.plan;
  const ch = a => `<button class="chip${r.acts.includes(a)?" done":""}${a===plan?" plan":""}" data-a="${esc(a)}" type="button" aria-pressed="${r.acts.includes(a)}">${esc(a)}</button>`;
  const n = Math.min(r.acts.length, NEED);
  p.innerHTML = `<h4>${esc(r.text)}</h4>
    <div class="bar"><i style="width:${n/NEED*100}%"></i></div>
    <p class="note">오늘 해본 걸 고르면 금이 가요 · ${NEED}개 중 ${n}개</p>
    ${plan ? `<p class="plan">어제 정한 것 — ${esc(plan)}</p>` : ""}
    <h3>해본 것</h3><div class="chips">${acts.map(ch).join("")}</div>
    <h3>바꿀 수 없는 거라면</h3><div class="chips">${LETGO.map(ch).join("")}</div>
    ${isReady(r) ? `<p class="callout">금이 다 갔어요. 위의 바위를 세 번 눌러 깨뜨리세요.</p>` : ""}
    <div class="foot"><span class="note">${rocks.filter(x=>!x.fate).length}개 남음</span><button class="linkbtn" id="carryBtn" type="button">${carryOpen?"닫기":"내일로 넘기기"}</button></div>
    ${carryOpen ? `<div class="carrybox"><p class="note" style="margin-bottom:8px">내일 해볼 것을 하나 고르면 아침에 알려드려요</p>
      <div class="chips">${PLANS.map(x=>`<button class="chip" data-plan="${esc(x)}" type="button">${esc(x)}</button>`).join("")}<button class="chip ghost" data-plan="" type="button">그냥 넘기기</button></div></div>` : ""}`;
  p.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if(r.acts.includes(a)){ r.acts.splice(r.acts.indexOf(a),1); renderToday(); return; }
    if(a === "1분 숨 고르기"){ breathe(() => addAct(r, a)); return; }
    addAct(r, a);
  });
  $("carryBtn").onclick = () => { carryOpen = !carryOpen; renderPanel(r); };
  p.querySelectorAll("[data-plan]").forEach(b => b.onclick = () => { r.fate = "carry"; r.plan = b.dataset.plan || null; carryOpen = false; caption("내일로 보냈어요"); setTimeout(()=>renderToday(), reduce?0:300); });
}
function addAct(r, a){
  const was = isReady(r);
  r.acts.push(a); renderToday();
  const el = document.querySelector(".rock.sel");
  if(el){ const q = el.getBoundingClientRect(); dust(q.left+q.width/2, q.top+q.height/2, 10); el.classList.add("hit"); }
  if(!was && isReady(r)){ caption("금이 다 갔어요"); if(navigator.vibrate) try{ navigator.vibrate([15,40,15]); }catch(e){} }
}
function tapRock(r, el, x, y, lv){
  if(r.fate) return;
  if(sel !== r.id){ sel = r.id; carryOpen = false; renderToday(); return; }
  if(!isReady(r)){ el.classList.remove("wob"); void el.offsetWidth; el.classList.add("wob"); return; }
  r.hits++;
  if(r.hits >= HITS){ r.fate = "smashed"; shatter(el, lv); caption(["내려놓았어요","잘 가","오늘은 여기까지"][Math.floor(Math.random()*3)]); setTimeout(()=>renderToday(), reduce?150:900); return; }
  el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit");
  el.querySelector("svg.ck").innerHTML = cracks(r.id).slice(0,crackN(r)).map(d=>`<path d="${d}"/>`).join("");
  chipsFX(x, y, lv, 6);
  if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
}
function caption(t){ const c = $("caption"); if(!c) return; c.textContent = t; c.classList.remove("go"); void c.offsetWidth; c.classList.add("go"); }
function finishDay(){
  const k = todayKey();
  if(step === 4){
    S.days[k] = { mood:draft.mood, did:draft.did, good:draft.good, memo:draft.memo,
      stress: rocks.map(r => ({cat:r.cat, text:r.text, carried:!!r.carried, acts:r.acts, fate:r.fate||"smashed", plan:r.fate==="carry"?r.plan:null})), at:Date.now() };
    S.carry = rocks.filter(r=>r.fate==="carry").map(r=>({cat:r.cat,text:r.text,from:k,plan:r.plan||null}));
    save();
  }
  step = 5; renderToday();
}
function summaryHTML(day, isToday){
  const sm = day.stress.filter(s=>s.fate!=="carry"), ca = day.stress.filter(s=>s.fate==="carry");
  const acts = [...new Set(day.stress.flatMap(s=>s.acts||[]))];
  return `<div class="card">
    <div class="sumhead">${dot(day.mood)}<b>${MOOD[day.mood]?.name||""}</b></div>
    ${day.memo?`<p class="memoq">“${esc(day.memo)}”</p>`:""}
    ${day.did.length?`<h3>한 것</h3><div class="chips">${day.did.map(d=>`<span class="chip sm static">${esc(d)}</span>`).join("")}</div>`:""}
    ${sm.length?`<h3>내려놓은 것</h3><div class="chips">${sm.map(s=>`<span class="chip sm static" style="text-decoration:line-through;color:var(--muted)">${esc(s.text)}</span>`).join("")}</div>`:""}
    ${acts.length?`<h3>금을 낸 행동</h3><div class="chips">${acts.map(a=>`<span class="chip sm static done">${esc(a)}</span>`).join("")}</div>`:""}
    ${ca.length?`<h3>내일로 넘긴 것</h3><div class="chips">${ca.map(s=>`<span class="chip sm static">${esc(s.text)}${s.plan?` · ${esc(s.plan)}`:""}</span>`).join("")}</div>`:""}
    ${!day.stress.length?`<h3>나를 누른 것</h3><p class="empty">가벼운 하루였어요</p>`:""}
    ${day.good.length?`<h3>잘한 것</h3><div class="chips">${day.good.map(d=>`<span class="chip sm static">${esc(d)}</span>`).join("")}</div>`:""}
  </div>${isToday?`<p class="muted serif" style="text-align:center;margin:22px 0 6px">오늘 정리를 마쳤어요. 편히 쉬어요.</p><div style="text-align:center"><button class="linkbtn" id="redo" type="button">다시 정리하기</button></div>`:""}`;
}

// ---------- breathing ----------
let bT = [], bDone = null, bStarted = false;
function breathe(onDone){
  bDone = onDone; bStarted = false; const c=$("ring"), tx=$("bText");
  $("breathe").hidden = false; $("bSkip").textContent = "그만할래요"; $("bSkip").focus();
  c.className = "ring"; tx.textContent = "원을 따라 천천히"; let k = 0;
  const cycle = () => {
    if(k>=6){ tx.textContent = "잘했어요"; $("bSkip").textContent = "돌아가기"; return; }
    k++; bStarted = true; c.className="ring in"; tx.textContent="코로 천천히 들이마시고";
    bT.push(setTimeout(()=>{ c.className="ring out"; tx.textContent="입으로 길게 내쉬어요"; },4000));
    bT.push(setTimeout(cycle,10000));
  };
  bT.push(setTimeout(cycle,700));
}
$("bSkip").onclick = () => { bT.forEach(clearTimeout); bT=[]; $("breathe").hidden = true; const f = bDone; bDone = null; if(f && bStarted) f(); };

// ================= calendar =================
let calY, calM, calSel = null;
{ const d = parseKey(todayKey()); calY = d.getFullYear(); calM = d.getMonth(); }
function renderCal(){
  const el = $("vCal"), first = new Date(calY, calM, 1), n = new Date(calY, calM+1, 0).getDate(), tk = todayKey();
  let cells = WD.map(w=>`<span class="wd">${w}</span>`).join("");
  for(let i=0;i<first.getDay();i++) cells += `<span></span>`;
  for(let d=1; d<=n; d++){
    const k = `${calY}-${pad(calM+1)}-${pad(d)}`, day = S.days[k];
    cells += `<button type="button" data-k="${k}" class="${day?"has":""}${k===tk?" today":""}${k===calSel?" sel":""}" ${day?`style="background:${MOOD[day.mood]?.c}"`:""} aria-label="${calM+1}월 ${d}일${day?", "+(MOOD[day.mood]?.name||""):""}">${d}</button>`;
  }
  const monthDays = Object.keys(S.days).filter(k=>k.startsWith(`${calY}-${pad(calM+1)}`)).length;
  const sd = calSel && S.days[calSel] ? parseKey(calSel) : null;
  el.innerHTML = `<div class="card"><div class="calhead"><button type="button" id="pm" aria-label="이전 달">‹</button><b>${calY}년 ${calM+1}월</b><button type="button" id="nm" aria-label="다음 달">›</button></div>
    <div class="cal">${cells}</div>
    <div class="legend">${MOODS.map(m=>`<span><i style="background:${m.c}"></i>${m.name}</span>`).join("")}</div>
    <p class="note" style="margin-top:12px">이번 달 ${monthDays}일을 정리했어요</p></div>
    ${sd ? `<p class="muted serif" style="margin:18px 0 8px">${sd.getMonth()+1}월 ${sd.getDate()}일 ${WD[sd.getDay()]}요일</p>` + summaryHTML(S.days[calSel], false) : `<p class="empty" style="text-align:center;margin-top:18px">색이 있는 날을 누르면 그날이 보여요</p>`}`;
  $("pm").onclick = () => { calM--; if(calM<0){calM=11;calY--;} renderCal(); };
  $("nm").onclick = () => { calM++; if(calM>11){calM=0;calY++;} renderCal(); };
  el.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { if(S.days[b.dataset.k]){ calSel = b.dataset.k; renderCal(); } });
}

// ================= stats =================
let period = 30;
function renderStats(){
  const el = $("vStats"), since = period ? keyOf(new Date(Date.now()-(period-1)*864e5)) : "0";
  const days = Object.entries(S.days).filter(([k])=>k>=since).map(([k,d])=>({k,...d}));
  const seg = `<div class="seg">${[[7,"7일"],[30,"30일"],[0,"전체"]].map(([p,l])=>`<button type="button" data-p="${p}" class="${period===p?"on":""}">${l}</button>`).join("")}</div>`;
  if(!days.length){ el.innerHTML = seg + `<div class="card"><p class="empty">하루 정리가 쌓이면 여기서 나를 알 수 있어요.</p></div>`; bindSeg(); return; }
  const allS = days.flatMap(d=>d.stress), smashed = allS.filter(s=>s.fate!=="carry"), carried = allS.filter(s=>s.fate==="carry").length;
  const avgR = Math.round(days.reduce((a,d)=>a+d.mood,0)/days.length);
  let h = seg + `<div class="sumgrid">
    <div class="sum"><b>${days.length}일</b><span>정리한 날</span></div>
    <div class="sum"><b style="font-size:1.1rem;padding:6px 0 4px">${dot(avgR)}${MOOD[avgR].name}</b><span>평균 기분</span></div>
    <div class="sum"><b>${smashed.length}개</b><span>내려놓은 바위</span></div>
    <div class="sum"><b>${carried}개</b><span>내일로 넘긴 바위</span></div></div>`;

  const mc = countBy(days, d=>d.mood), mmax = Math.max(...Object.values(mc));
  h += `<div class="card"><h2 style="font-size:1.15rem;margin-bottom:14px">기분</h2>${MOODS.map(m=>`<div class="stat"><span>${m.name}</span><span class="track"><i style="width:${(mc[m.v]||0)/mmax*100}%;background:${m.c}"></i></span><span class="n">${mc[m.v]||0}</span></div>`).join("")}</div>`;

  if(allS.length){
    const cc = sorted(countBy(allS, s=>s.cat)), cmax = cc[0][1];
    h += `<div class="card"><h2 style="font-size:1.15rem;margin-bottom:14px">무엇이 나를 눌렀나</h2>${cc.map(([c,n])=>`<div class="stat"><span>${esc(CAT[c]?.name||"기타")}</span><span class="track"><i style="width:${n/cmax*100}%"></i></span><span class="n">${n}</span></div>`).join("")}
      <h3>자주 있었던 것</h3><ol class="rank">${sorted(countBy(allS, s=>s.text)).slice(0,5).map(([t,n])=>`<li>${esc(t)}<span>${n}번</span></li>`).join("")}</ol>
      <p class="insight">${esc(CAT[cc[0][0]]?.name||"기타")} 쪽이 전체의 ${Math.round(cc[0][1]/allS.length*100)}%로 가장 많았어요.</p></div>`;
  }

  const ha = sorted(countBy(smashed.flatMap(s=>(s.acts||[])), x=>x)).slice(0,5);
  if(ha.length) h += `<div class="card"><h2 style="font-size:1.15rem;margin-bottom:6px">나에게 통한 행동</h2><p class="note" style="margin-bottom:10px">실제로 바위를 깨는 데 쓰인 것들</p>
    <ol class="rank">${ha.map(([t,n])=>`<li>${esc(t)}<span>${n}번</span></li>`).join("")}</ol></div>`;

  const goodDays = days.filter(d=>d.mood>=4), hardDays = days.filter(d=>d.mood<=2);
  if(goodDays.length || hardDays.length){
    const gd = sorted(countBy(goodDays.flatMap(d=>d.did), x=>x)).slice(0,3);
    const hd = sorted(countBy(hardDays.flatMap(d=>d.stress), s=>s.text)).slice(0,3);
    h += `<div class="card"><h2 style="font-size:1.15rem;margin-bottom:4px">좋은 날과 힘든 날</h2>
      <h3>기분 좋은 날 자주 한 것</h3>${gd.length?`<ol class="rank">${gd.map(([t,n])=>`<li>${esc(t)}<span>${n}번</span></li>`).join("")}</ol>`:`<p class="empty">아직 기록이 부족해요</p>`}
      <h3>힘든 날 자주 있던 것</h3>${hd.length?`<ol class="rank">${hd.map(([t,n])=>`<li>${esc(t)}<span>${n}번</span></li>`).join("")}</ol>`:`<p class="empty">아직 기록이 부족해요</p>`}
      ${gd.length?`<p class="insight">기분 좋은 날엔 ‘${esc(gd[0][0])}’가 자주 있었어요.</p>`:""}</div>`;
  }

  const sum=[0,0,0,0,0,0,0], cnt=[0,0,0,0,0,0,0];
  days.forEach(d=>{ const w = parseKey(d.k).getDay(); sum[w]+=d.mood; cnt[w]++; });
  const order=[1,2,3,4,5,6,0];
  h += `<div class="card"><h2 style="font-size:1.15rem;margin-bottom:14px">요일별 기분</h2><div class="days">${order.map(w=>{ const a = cnt[w]?sum[w]/cnt[w]:0; return `<div><i style="height:${a/5*90}%;background:${cnt[w]?MOOD[Math.round(a)].c:"transparent"}"></i>${WD[w]}</div>`; }).join("")}</div>`;
  const valid = order.filter(w=>cnt[w]);
  if(valid.length>=3){ const worst = valid.reduce((a,w)=>sum[w]/cnt[w] < sum[a]/cnt[a] ? w : a); h += `<p class="insight">${WD[worst]}요일이 가장 무거운 편이에요.</p>`; }
  h += `</div>`;

  const gc = sorted(countBy(days.flatMap(d=>d.good), x=>x)).slice(0,5);
  if(gc.length) h += `<div class="card"><h2 style="font-size:1.15rem;margin-bottom:6px">내가 자주 잘한 것</h2><ol class="rank">${gc.map(([t,n])=>`<li>${esc(t)}<span>${n}번</span></li>`).join("")}</ol></div>`;
  el.innerHTML = h; bindSeg();
}
function bindSeg(){ $("vStats").querySelectorAll("[data-p]").forEach(b => b.onclick = () => { period = Number(b.dataset.p); renderStats(); }); }

// ================= particles =================
const cv=$("fx"), ctx=cv.getContext("2d"); let parts=[], raf=null;
function resize(){ const d=devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; ctx.setTransform(d,0,0,d,0,0); }
addEventListener("resize", resize); resize();
const STONE = {1:["#8D929F","#5E6371","#454956"],2:["#7A7F8C","#4C5160","#383C47"],3:["#6A6F7C","#3E4250","#2A2D36"]};
function shatter(el, lv){
  const r = el.getBoundingClientRect(), cx = r.left+r.width/2, cy = r.top+r.height/2;
  el.style.transition = "opacity .25s"; el.style.opacity = "0";
  if(reduce) return;
  const cols = PARTC[styleOf()];
  for(let i=0;i<28+lv*10;i++){
    const x=r.left+Math.random()*r.width, y=r.top+Math.random()*r.height;
    const ang=Math.atan2(y-cy, x-cx)+(Math.random()-.5)*.7, sp=2.5+Math.random()*6+lv, sz=5+Math.random()*16;
    parts.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-4,rot:Math.random()*6,vr:(Math.random()-.5)*.35,
      pts:[[0,-sz*.6],[sz*.55,sz*.35],[-sz*.45,sz*.5]].map(([a,b])=>[a*(.6+Math.random()*.8),b*(.6+Math.random()*.8)]),color:cols[Math.floor(Math.random()*3)],life:1});
  }
  dust(cx, cy, 60);
  document.body.animate([{transform:"translate(0,0)"},{transform:"translate(-2px,1px)"},{transform:"translate(2px,-1px)"},{transform:"translate(0,0)"}],{duration:220});
  if(navigator.vibrate) try{ navigator.vibrate([25,30,50]); }catch(e){}
  run();
}
function chipsFX(x,y,lv,n){
  if(reduce) return; const cols = PARTC[styleOf()];
  for(let i=0;i<n;i++){ const a=-Math.PI/2+(Math.random()-.5)*2.2, sp=2+Math.random()*4, sz=3+Math.random()*5; parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,rot:Math.random()*6,vr:(Math.random()-.5)*.4,pts:[[0,-sz],[sz,sz*.6],[-sz,sz*.7]],color:cols[i%3],life:.85}); }
  dust(x,y,8);
}
function dust(x,y,n){
  if(reduce) return;
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=.6+Math.random()*3.2; parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.8,r:.8+Math.random()*1.8,life:1,decay:.006+Math.random()*.01,gold:true}); }
  run();
}
function run(){ if(!raf) raf=requestAnimationFrame(tick); }
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p=>p.life>0 && p.y<innerHeight+60);
  for(const p of parts){
    if(p.gold){ p.x+=p.vx; p.y+=p.vy; p.vx*=.97; p.vy=p.vy*.97-.02; p.life-=p.decay;
      ctx.globalAlpha=Math.max(p.life,0); ctx.fillStyle="#EED49A"; ctx.shadowColor="rgba(238,212,154,.9)"; ctx.shadowBlur=6;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; }
    else { p.vy+=.42; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.rot+=p.vr; p.life-=.011;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.max(p.life,0); ctx.fillStyle=p.color; ctx.strokeStyle="rgba(255,255,255,.12)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(...p.pts[0]); ctx.lineTo(...p.pts[1]); ctx.lineTo(...p.pts[2]); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
  raf = parts.length ? requestAnimationFrame(tick) : null;
  if(!raf) ctx.clearRect(0,0,innerWidth,innerHeight);
}

renderToday();

// ================= auto update (GitHub Pages) =================
const APP_VERSION = "2026-10-28-1";
if(/github\.io$/.test(location.hostname)){
  const check = async () => {
    try{
      const res = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
      const m = (await res.text()).match(/APP_VERSION = "([^"]+)"/);
      if(m && m[1] !== APP_VERSION && step < 0){
        let last = null; try{ last = sessionStorage.getItem("reloadedFor"); }catch(e){}
        if(last !== m[1]){ try{ sessionStorage.setItem("reloadedFor", m[1]); }catch(e){} location.replace(location.pathname + "?v=" + encodeURIComponent(m[1])); }
      }
    }catch(e){}
  };
  check();
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") check(); });
}

// ================= sync inside Claude =================
if(window.claude && claude.use){
  (async()=>{ try{
    const [db,user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db||!user) return; const uid = await user.id(); if(!uid) return;
    ref = db.collection("data/users/"+uid).doc("journal");
    const d = (await ref.get()).data?.();
    if(d && d.days){ S = { days:d.days||{}, carry:d.carry||[] }; if(step<0){ if(view==="today") renderToday(); else if(view==="cal") renderCal(); else renderStats(); } }
    else if(Object.keys(S.days).length) save();
  }catch(e){ ref=null; } })();
}
})();
