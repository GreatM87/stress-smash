<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스트레스 파괴소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E8E4F0; --surface:#F7F5FB; --ink:#2B1B3D; --muted:#6E6280;
  --hot:#FF3D7F; --spark:#FFD23F; --sky:#4C6FFF; --hero:#7FD8C3; --ground:#CFC6E0;
  --r1:#B9A7F2; --r2:#FF8FB5; --r3:#FF3D7F; --line:#2B1B3D; --chip:#EFEBF7;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1424; --surface:#251D33; --ink:#F2ECFA; --muted:#A99BBD; --ground:#3A2F4C; --chip:#30263F;
    --r1:#8B76D8; --r2:#E06696; --line:#F2ECFA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1424; --surface:#251D33; --ink:#F2ECFA; --muted:#A99BBD; --ground:#3A2F4C; --chip:#30263F;
  --r1:#8B76D8; --r2:#E06696; --line:#F2ECFA; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.55;overflow-x:hidden}
.wrap{max-width:520px;margin:0 auto;padding:22px 16px 80px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-family:"Black Han Sans","Apple SD Gothic Neo",sans-serif;font-weight:400;font-size:clamp(2rem,9vw,2.5rem);line-height:1;margin:0}
.count{text-align:right;color:var(--muted);font-size:.9rem;line-height:1.2;margin:0}
.count b{display:block;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:1.9rem;color:var(--hot)}
h2{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:1.35rem;margin:0 0 12px}
button{font:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible,input:focus-visible,.rock:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.card{background:var(--surface);border:2.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:22px}

/* scene */
.scene{position:relative;background:var(--surface);border:2.5px solid var(--line);border-radius:22px;box-shadow:5px 5px 0 var(--line);padding:18px 12px 0;min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;overflow:hidden;margin-bottom:18px}
.mood{position:absolute;top:12px;left:14px;right:14px;font-size:.95rem;color:var(--muted);text-align:center;margin:0}
.stack{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:40px}
.rock{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 18px;margin-top:-6px;border:2.5px solid #2B1B3D;color:#2B1B3D;font-weight:700;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere;line-height:1.3}
.rock.l1{background:var(--r1);width:min(56%,220px);min-height:54px;border-radius:46% 54% 40% 60% / 58% 50% 50% 42%;font-size:.93rem}
.rock.l2{background:var(--r2);width:min(70%,280px);min-height:70px;border-radius:38% 62% 52% 48% / 60% 44% 56% 40%}
.rock.l3{background:var(--r3);color:#fff;width:min(86%,340px);min-height:90px;border-radius:52% 48% 44% 56% / 48% 62% 38% 52%;font-size:1.06rem}
.rock:nth-child(odd){transform:rotate(-2deg)} .rock:nth-child(even){transform:rotate(2.5deg) translateX(6px)}
.rock.sel{outline:3px dashed var(--sky);outline-offset:4px}
.rock.ready{box-shadow:0 0 0 4px var(--spark),0 0 18px 6px var(--spark)}
.rock.wig{animation:wig .25s}
@keyframes wig{0%,100%{translate:0 0}25%{translate:-4px 0}75%{translate:4px 0}}
.rock.hit{animation:hit .13s}
@keyframes hit{0%{translate:0 0}30%{translate:-6px 3px}60%{translate:5px -2px}100%{translate:0 0}}
.rock span{position:relative;z-index:2;pointer-events:none}
.rock svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
.rock svg path{fill:none;stroke:#2B1B3D;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rock.l3 svg path{stroke:#fff}
.hero{width:130px;height:96px;margin-top:-4px;transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.hero.boing{animation:boing .8s cubic-bezier(.3,1.8,.5,1)}
@keyframes boing{0%{translate:0 0}35%{translate:0 -38px}100%{translate:0 0}}
.ground{width:calc(100% + 24px);height:26px;background:var(--ground);border-top:2.5px solid var(--line)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border:2px solid var(--line);border-radius:999px;background:var(--chip);font-size:.95rem;line-height:1.3;text-align:left}
.chip.on{background:var(--ink);color:var(--surface)}
.chip.done{background:var(--hero);color:#2B1B3D;text-decoration:line-through;text-decoration-thickness:2px}
.chip.ghost{background:transparent;border-style:dashed;color:var(--muted)}
.chip small{opacity:.7;margin-left:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:6px 12px;border:none;border-bottom:3px solid transparent;background:none;color:var(--muted);font-size:.95rem}
.tab.on{color:var(--ink);border-bottom-color:var(--hot);font-weight:700}
.sub{font-size:.88rem;color:var(--muted);margin:14px 0 8px}
.weights{display:flex;gap:8px;margin-top:6px}
.wbtn{flex:1;padding:10px 6px;border:2.5px solid #2B1B3D;border-radius:14px;font-size:.95rem;color:#2B1B3D}
.wbtn.l1{background:var(--r1)} .wbtn.l2{background:var(--r2)} .wbtn.l3{background:var(--r3);color:#fff}
.pending{margin-top:14px;padding:12px;border:2px dashed var(--line);border-radius:14px}
.pending p{margin:0 0 4px;font-weight:700}
.own{display:flex;gap:8px;margin-top:12px}
.own input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;background:var(--bg);color:var(--ink)}
.own button{padding:9px 14px;border:2px solid var(--line);border-radius:12px;background:var(--spark);color:#2B1B3D}
.linkbtn{border:none;background:none;color:var(--muted);text-decoration:underline;padding:6px 0;font-size:.9rem}

/* panel */
.panel h3{margin:0;font-size:1.1rem;word-break:keep-all;overflow-wrap:anywhere}
.panel .meta{margin:2px 0 12px;font-size:.88rem;color:var(--muted)}
.bar{height:12px;border:2px solid var(--line);border-radius:999px;overflow:hidden;margin:0 0 4px}
.bar i{display:block;height:100%;background:var(--hot);transition:width .25s}
.readymsg{margin:12px 0 0;padding:12px;border-radius:12px;background:var(--spark);color:#2B1B3D;font-weight:700;text-align:center}
.panel .foot{display:flex;justify-content:flex-end;margin-top:10px}

/* insights */
.stat{display:grid;grid-template-columns:5.5em 1fr 2em;align-items:center;gap:8px;margin-bottom:8px;font-size:.92rem}
.stat .track{height:16px;background:var(--chip);border-radius:6px;overflow:hidden}
.stat .track i{display:block;height:100%;background:var(--r2);border-right:2px solid var(--line)}
.stat .n{text-align:right;color:var(--muted)}
.rank{margin:0;padding-left:1.4em}
.rank li{margin-bottom:4px}
.rank li span{color:var(--muted);font-size:.88rem;margin-left:6px}
.insightline{margin:14px 0 0;padding:12px;border-radius:12px;background:var(--chip);font-size:.95rem}
.empty{color:var(--muted);font-size:.95rem;margin:0}
.help{font-size:.82rem;color:var(--muted);margin-top:28px}

/* nav + stats */
.nav{display:flex;background:var(--surface);border:2.5px solid var(--line);border-radius:999px;padding:4px;margin:0 0 18px}
.nav button{flex:1;border:none;background:none;padding:9px;border-radius:999px;font-weight:700;color:var(--muted)}
.nav button.on{background:var(--ink);color:var(--surface)}
.seg{display:flex;gap:6px;margin:0 0 14px}
.seg button{flex:1;padding:7px;border:2px solid var(--line);border-radius:999px;background:transparent;font-size:.92rem}
.seg button.on{background:var(--ink);color:var(--surface)}
.sumgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px}
.sum{background:var(--surface);border:2.5px solid var(--line);border-radius:16px;padding:12px 14px}
.sum b{display:block;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:1.8rem;line-height:1.1}
.sum span{font-size:.85rem;color:var(--muted)}
.stat .pct{color:var(--muted);font-size:.8rem;margin-left:4px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:130px}
.days div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:.8rem;color:var(--muted)}
.days i{width:70%;background:var(--r1);border:2px solid var(--line);border-radius:6px 6px 2px 2px;min-height:3px}
.days .max i{background:var(--hot)}
.days em{font-style:normal;font-size:.75rem}
.log{list-style:none;margin:0;padding:0}
.log li{padding:10px 0;border-bottom:1.5px dashed color-mix(in srgb,var(--muted) 45%,transparent)}
.log li:last-child{border-bottom:none}
.log .d{display:block;font-size:.8rem;color:var(--muted)}
.log .h{display:block;font-size:.88rem;color:var(--muted)}

/* fx */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.boom{position:fixed;left:50%;top:38%;z-index:60;pointer-events:none;font-family:"Black Han Sans",sans-serif;font-size:clamp(3rem,16vw,5.2rem);color:var(--spark);-webkit-text-stroke:3px #2B1B3D;transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0;white-space:nowrap}
.boom.go{animation:boom 1s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes boom{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(-5deg)}75%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-5deg)}100%{opacity:0;transform:translate(-50%,-62%) scale(1) rotate(-5deg)}}
.shake{animation:shake .35s linear}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}

/* overlays */
.ov{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--bg) 95%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
.ov[hidden]{display:none}
.ov p{margin:0;font-size:1.08rem}
.ov .big{font-family:"Black Han Sans",sans-serif;font-size:1.8rem}
.ov .chips{justify-content:center;max-width:420px}
.circle{width:180px;height:180px;border-radius:50%;background:var(--hero);border:3px solid #2B1B3D;transform:scale(.55)}
.circle.in{transition:transform 4s ease-in-out;transform:scale(1)}
.circle.out{transition:transform 6s ease-in-out;transform:scale(.55)}
@media (prefers-reduced-motion:reduce){.shake,.rock.hit,.rock.wig,.hero.boing{animation:none}.boom.go{animation-duration:.01s}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="boom" id="boom">박살!</div>

<div class="ov" id="breathe" hidden role="dialog" aria-modal="true" aria-label="숨 고르기">
  <p class="big">1분 숨 고르기</p>
  <div class="circle" id="circle"></div>
  <p id="bText">원을 따라 숨 쉬어요</p>
  <button class="chip" id="bSkip" type="button">그만할래요</button>
</div>

<div class="ov" id="reflect" hidden role="dialog" aria-modal="true" aria-label="돌아보기">
  <p class="big">깨뜨렸어요!</p>
  <p>뭐가 제일 도움이 됐어요?</p>
  <div class="chips" id="rChips"></div>
</div>

<main class="wrap">
  <header>
    <h1>스트레스<br>파괴소</h1>
    <p class="count"><b id="count">0</b>개 깨뜨림</p>
  </header>
  <nav class="nav" aria-label="메뉴">
    <button type="button" class="on" data-view="main" aria-pressed="true">파괴소</button>
    <button type="button" data-view="stats" aria-pressed="false">통계</button>
  </nav>
  <div id="vMain">

  <section class="scene" aria-label="스트레스 바위 더미">
    <p class="mood" id="mood"></p>
    <div class="stack" id="stack"></div>
    <svg class="hero" id="hero" viewBox="0 0 130 96" aria-hidden="true">
      <path d="M10 92 C6 50 30 14 65 14 C100 14 124 50 120 92 Z" fill="var(--hero)" stroke="#2B1B3D" stroke-width="3"/>
      <g id="face"></g>
    </svg>
    <div class="ground"></div>
  </section>

  <section class="card panel" id="panel" hidden></section>

  <section class="card" id="picker">
    <h2>지금 뭐가 나를 누르고 있어요?</h2>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="chips" id="stressChips"></div>
    <div id="pickExtra"></div>
  </section>

  </div>
  <div id="vStats" hidden>
    <div class="seg" id="period">
      <button type="button" data-p="7">7일</button>
      <button type="button" data-p="30" class="on">30일</button>
      <button type="button" data-p="0">전체</button>
    </div>
    <div class="sumgrid" id="sSum"></div>
    <section class="card"><h2>어디서 스트레스를 받았나</h2><div id="sCat"></div></section>
    <section class="card"><h2>자주 나를 누른 것</h2><div id="sTop"></div></section>
    <section class="card"><h2>요일별 스트레스</h2><div id="sDay"></div></section>
    <section class="card"><h2>나한테 효과 있던 방법</h2><div id="sHelp"></div></section>
    <section class="card"><h2>최근 깨뜨린 바위</h2><div id="sLog"></div></section>
  </div>

  <p class="help">많이 힘들 땐 혼자 버티지 말고 믿는 사람이나 전문가와 이야기해 보세요. 자살예방상담전화 109, 정신건강위기상담 1577-0199.</p>
</main>

<script>
(() => {
const CATS = [
 {id:"work", name:"일·공부", s:{
  "마감이 코앞":["뼈대·목차만 먼저 잡기","제일 쉬운 부분 10분만 하기","기한 조정 가능한지 물어보기","오늘 할 분량만 정하기"],
  "할 일이 너무 많아":["할 일 전부 적어보기","오늘 꼭 할 3개만 고르기","안 해도 되는 일 하나 지우기"],
  "발표·시험 앞둠":["소리 내서 한 번 연습하기","예상 질문 3개 적기","전날 일찍 자기로 정하기"],
  "실수했어":["바로잡을 수 있는 것 하나 하기","관련된 사람에게 먼저 알리기","다음엔 어떻게 할지 한 줄 적기"],
  "일이 손에 안 잡혀":["타이머 15분 맞추고 시작하기","자리 정리하고 물 한 잔","휴대폰 다른 곳에 두기"]}},
 {id:"rel", name:"관계", s:{
  "눈치 보이는 사람":["내가 바꿀 수 있는 것만 구분하기","필요한 말만 짧게 정리하기","믿는 사람에게 털어놓기"],
  "서운한 일":["서운한 점 한 문장으로 적기","말할지 넘길지 정하기","하루 지나고 다시 생각하기"],
  "다퉜어":["내 마음 먼저 가라앉히기","상대 입장 한 줄 적어보기","먼저 짧게 연락해보기"],
  "연락이 부담돼":["답장 미뤄도 된다고 정하기","짧게라도 답하기","알림 잠시 꺼두기"],
  "외로워":["편한 사람에게 안부 보내기","사람 있는 곳으로 산책","좋아하는 거 하나 하기"]}},
 {id:"body", name:"몸·컨디션", s:{
  "잠을 못 잤어":["20분 낮잠 자기","오늘 밤 일찍 눕기로 정하기","오후엔 카페인 끊기"],
  "너무 피곤해":["물 한 잔 마시기","10분 걷기","오늘 할 일 하나 덜어내기"],
  "몸이 안 좋아":["쉬어도 된다고 허락하기","필요하면 병원 예약하기","따뜻한 거 먹기"],
  "운동을 못 했어":["5분 스트레칭","계단으로 다니기","내일 운동 시간 정해두기"]}},
 {id:"money", name:"돈", s:{
  "카드값·지출":["이번 달 지출 확인하기","줄일 항목 하나 정하기","장바구니 비우기"],
  "수입 걱정":["고정 지출 적어보기","필요한 금액 숫자로 정하기","상의할 사람 찾아보기"],
  "갚아야 할 돈":["갚을 날짜와 금액 정리하기","상대에게 일정 알리기","이번 달 가능한 만큼만 정하기"]}},
 {id:"future", name:"미래·불안", s:{
  "진로 고민":["고민 전부 적어보기","궁금한 것 하나 알아보기","먼저 가본 사람에게 물어보기"],
  "이대로 괜찮을까":["요즘 잘한 일 3개 적기","걱정을 구체적인 문장으로 바꾸기","오늘 할 것 하나만 하기"],
  "결정을 못 하겠어":["선택지 장단점 적기","결정 마감 시간 정하기","동전 던져보고 내 반응 보기"],
  "막연히 불안해":["걱정을 종이에 써서 버리기","지금 할 수 있는 것 하나 하기","5분 밖에 나가기"]}},
 {id:"life", name:"생활", s:{
  "집안일 밀림":["딱 한 곳만 치우기","빨래 돌리기","10분 타이머 정리"],
  "출퇴근·이동":["좋아하는 음악 준비하기","조금 일찍 나서기","이동 시간엔 쉬기로 정하기"],
  "처리할 서류·행정":["필요한 것 목록 적기","오늘 하나만 처리하기","마감일 달력에 적기"],
  "쉬지를 못해":["쉬는 시간 미리 정하기","알림 끄고 30분","아무것도 안 하기 허락하기"]}}
];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));
CAT.etc = {id:"etc", name:"기타", s:{}};
const GENERIC = ["작게 쪼개서 하나만 하기","바꿀 수 있는 것만 구분하기","믿는 사람에게 털어놓기"];
const LETGO = ["1분 숨 고르기","누군가에게 털어놓기","써서 버리기"];
const LVN = {1:"자갈",2:"바위",3:"큰 바위"};
const FINAL_HITS = 3;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let state = { items:[], added:[], smashed:[] };
let sel = null, tab = "work", pending = null, ownOpen = false, ref = null;

// ---------- storage ----------
const LS = "stress-smash-v3";
try{
  const v = localStorage.getItem(LS);
  if(v) state = Object.assign(state, JSON.parse(v));
  else {
    const o = JSON.parse(localStorage.getItem("stress-smash-v2") || localStorage.getItem("stress-smash-v1") || "null");
    if(o){ state.items = (o.items||[]).map(i=>({id:i.id,text:i.text,level:i.level,cat:"etc",done:[],hits:0,at:i.at||Date.now()})); state.smashed = (o.smashed||[]).map(s=>({text:s.text,cat:"etc",at:s.at})); }
  }
}catch(e){}
let st = null;
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
  if(!ref) return;
  clearTimeout(st);
  st = setTimeout(()=>{ ref.set({ items:state.items, added:state.added.slice(-300), smashed:state.smashed.slice(-300) }).catch(()=>{}); }, 600);
}

// ---------- helpers ----------
const need = it => it.level;
const ready = it => it.done.length >= need(it);
function actionsFor(it){ const c = CAT[it.cat]; return (c && c.s[it.text]) || GENERIC; }
function rng(seed){ let h=2166136261; for(const c of seed){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%10000)/10000; }; }
function cracks(id){ const r=rng(id), out=[]; for(let i=0;i<9;i++){ let x=35+r()*30,y=35+r()*30,a=r()*Math.PI*2,d=`M${x.toFixed(1)} ${y.toFixed(1)}`; const n=3+Math.floor(r()*3); for(let k=0;k<n;k++){ a+=(r()-.5)*1.1; const L=8+r()*12; x+=Math.cos(a)*L; y+=Math.sin(a)*L; d+=` L${x.toFixed(1)} ${y.toFixed(1)}`; } out.push(d); } return out; }
function crackCount(it){ return Math.min(9, Math.round((Math.min(it.done.length,need(it))/need(it))*6) + it.hits); }
function countBy(arr, key){ const m={}; arr.forEach(x=>{ const k=key(x); if(k) m[k]=(m[k]||0)+1; }); return m; }

// ---------- character ----------
function drawHero(){
  const p = state.items.reduce((s,i)=>s + Math.max(0, i.level - Math.min(i.done.length,i.level)*0.5), 0);
  const sq = Math.min(p*0.06, 0.5);
  $("hero").style.transform = `scale(${1+sq*0.55}, ${1-sq})`;
  let f, m;
  if(p===0){ f=`<circle cx="48" cy="48" r="5" fill="#2B1B3D"/><circle cx="82" cy="48" r="5" fill="#2B1B3D"/><path d="M46 62 Q65 80 84 62" stroke="#2B1B3D" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="36" cy="60" r="5" fill="#FF8FB5"/><circle cx="94" cy="60" r="5" fill="#FF8FB5"/>`; m = state.smashed.length ? "가벼워요!" : "아래에서 지금 나를 누르는 걸 골라보세요"; }
  else if(p<=2.5){ f=`<circle cx="48" cy="50" r="5" fill="#2B1B3D"/><circle cx="82" cy="50" r="5" fill="#2B1B3D"/><path d="M50 66 Q65 72 80 66" stroke="#2B1B3D" stroke-width="3.5" fill="none" stroke-linecap="round"/>`; m="조금 무거워요"; }
  else if(p<=6){ f=`<path d="M42 50 L54 50 M76 50 L88 50" stroke="#2B1B3D" stroke-width="3.5" stroke-linecap="round"/><path d="M52 68 L78 68" stroke="#2B1B3D" stroke-width="3.5" stroke-linecap="round"/><path d="M96 34 q4 8 0 12 q-4 -4 0 -12" fill="var(--sky)"/>`; m="꽤 짓눌리는 중…"; }
  else { f=`<path d="M42 44 L54 54 M54 44 L42 54 M76 44 L88 54 M88 44 L76 54" stroke="#2B1B3D" stroke-width="3.5" stroke-linecap="round"/><path d="M50 72 Q57 64 65 72 Q73 80 80 72" stroke="#2B1B3D" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M98 30 q5 10 0 15 q-5 -5 0 -15 M28 36 q4 8 0 12 q-4 -4 0 -12" fill="var(--sky)"/>`; m="으아아 납작해지는 중!"; }
  $("face").innerHTML = f; $("mood").textContent = m;
}

// ---------- render ----------
function render(){
  $("count").textContent = state.smashed.length;
  renderStack(); drawHero(); renderPanel(); renderPicker(); renderInsights();
}
function renderStack(){
  const s = $("stack"); s.innerHTML = "";
  state.items.forEach(it => {
    const b = document.createElement("div");
    b.className = `rock l${it.level}${sel===it.id?" sel":""}${ready(it)?" ready":""}`;
    b.tabIndex = 0; b.setAttribute("role","button");
    b.setAttribute("aria-label", `${it.text}, ${LVN[it.level]}${ready(it)?", 깰 준비 완료":""}`);
    b.innerHTML = `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${cracks(it.id).slice(0,crackCount(it)).map(d=>`<path d="${d}"/>`).join("")}</svg><span>${esc(it.text)}</span>`;
    b.addEventListener("pointerdown", e => { e.preventDefault(); tapRock(it.id, b, e.clientX, e.clientY); });
    b.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); const r=b.getBoundingClientRect(); tapRock(it.id,b,r.left+r.width/2,r.top+r.height/2); } });
    s.appendChild(b);
  });
}
function renderPanel(){
  const it = state.items.find(x=>x.id===sel), p = $("panel");
  p.hidden = !it; if(!it) return;
  const acts = actionsFor(it), n = need(it), d = Math.min(it.done.length,n);
  const chip = a => `<button class="chip${it.done.includes(a)?" done":""}" data-act="${esc(a)}" type="button"${it.done.includes(a)?' aria-pressed="true"':''}>${esc(a)}</button>`;
  p.innerHTML = `
    <h3>${esc(it.text)}</h3>
    <p class="meta">${esc(CAT[it.cat]?.name||"기타")} · ${LVN[it.level]} · 행동 ${n}개면 깰 수 있어요</p>
    <div class="bar"><i style="width:${d/n*100}%"></i></div>
    ${ready(it) ? `<p class="readymsg">금이 다 갔어요. 위의 바위를 쳐서 깨뜨리세요!</p>` : ""}
    <p class="sub">해본 걸 눌러요</p>
    <div class="chips">${acts.map(chip).join("")}</div>
    <p class="sub">내가 바꿀 수 없는 거라면</p>
    <div class="chips">${LETGO.map(chip).join("")}</div>
    <div class="foot"><button class="linkbtn" id="drop" type="button">그냥 치우기</button></div>`;
  p.querySelectorAll("[data-act]").forEach(b => b.onclick = () => doAction(it, b.dataset.act));
  $("drop").onclick = () => { state.items = state.items.filter(x=>x.id!==it.id); sel=null; save(); render(); };
}
function renderPicker(){
  const freq = countBy(state.added, x=>x.cat+"|"+x.text);
  const top = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,n])=>{ const [c,...t]=k.split("|"); return {cat:c,text:t.join("|"),n}; });
  const tabsList = (top.length ? [{id:"fav",name:"자주 고른 것"}] : []).concat(CATS);
  if(tab==="fav" && !top.length) tab = "work";
  $("tabs").innerHTML = tabsList.map(c=>`<button class="tab${tab===c.id?" on":""}" role="tab" aria-selected="${tab===c.id}" data-tab="${c.id}" type="button">${esc(c.name)}</button>`).join("");
  $("tabs").querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab=b.dataset.tab; pending=null; ownOpen=false; renderPicker(); });
  const list = tab==="fav" ? top : Object.keys(CAT[tab].s).map(t=>({cat:tab,text:t,n:freq[tab+"|"+t]||0}));
  const onRock = new Set(state.items.map(i=>i.cat+"|"+i.text));
  $("stressChips").innerHTML = list.map(x=>{
    const on = pending && pending.cat===x.cat && pending.text===x.text;
    const has = onRock.has(x.cat+"|"+x.text);
    return `<button class="chip${on?" on":""}" data-c="${esc(x.cat)}" data-t="${esc(x.text)}" type="button"${has?" disabled style='opacity:.45'":""}>${esc(x.text)}${x.n?`<small>${x.n}</small>`:""}</button>`;
  }).join("") + (tab!=="fav" ? `<button class="chip ghost" id="ownBtn" type="button">+ 직접 쓰기</button>` : "");
  $("stressChips").querySelectorAll("[data-t]").forEach(b => b.onclick = () => { pending = {cat:b.dataset.c, text:b.dataset.t}; ownOpen=false; renderPicker(); });
  const ob = $("ownBtn"); if(ob) ob.onclick = () => { ownOpen = true; pending = null; renderPicker(); setTimeout(()=>$("ownIn")?.focus(),0); };
  let ex = "";
  if(ownOpen) ex = `<div class="own"><input id="ownIn" maxlength="30" placeholder="${esc(CAT[tab].name)} 쪽 스트레스를 짧게"><button id="ownOk" type="button">다음</button></div>`;
  if(pending) ex = `<div class="pending"><p>${esc(pending.text)}</p><span class="sub">얼마나 무거워요?</span>
    <div class="weights">${[1,2,3].map(l=>`<button class="wbtn l${l}" data-l="${l}" type="button">${LVN[l]}</button>`).join("")}</div>
    <button class="linkbtn" id="pCancel" type="button">취소</button></div>`;
  $("pickExtra").innerHTML = ex;
  if(ownOpen){ const go = () => { const v=$("ownIn").value.trim(); if(!v) return; pending={cat:tab,text:v}; ownOpen=false; renderPicker(); };
    $("ownOk").onclick = go; $("ownIn").onkeydown = e => { if(e.key==="Enter") go(); }; }
  if(pending){ $("pickExtra").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>addRock(Number(b.dataset.l))); $("pCancel").onclick=()=>{ pending=null; renderPicker(); }; }
}
function renderInsightsOld(){
  const b = $("insBody"), since = Date.now() - 30*864e5;
  const recent = state.added.filter(x=>x.at>=since);
  if(!recent.length && !state.smashed.length){ b.innerHTML = `<p class="empty">바위를 올리고 깨다 보면, 내가 어디서 스트레스를 많이 받는지 여기 모여요.</p>`; return; }
  const byCat = countBy(recent, x=>x.cat), max = Math.max(1,...Object.values(byCat));
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const byText = Object.entries(countBy(recent, x=>x.text)).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const helped = Object.entries(countBy(state.smashed, x=>x.helped)).filter(([k])=>k!=="잘 모르겠어").sort((a,b)=>b[1]-a[1]).slice(0,3);
  const durs = state.smashed.filter(s=>s.addedAt).map(s=>(s.at-s.addedAt)/864e5);
  const avg = durs.length ? durs.reduce((a,c)=>a+c,0)/durs.length : null;
  let h = `<p class="sub" style="margin-top:0">최근 30일, 종류별</p>`;
  h += cats.map(([c,n])=>`<div class="stat"><span>${esc(CAT[c]?.name||"기타")}</span><span class="track"><i style="width:${n/max*100}%"></i></span><span class="n">${n}</span></div>`).join("");
  if(byText.length) h += `<p class="sub">자주 나를 누른 것</p><ol class="rank">${byText.map(([t,n])=>`<li>${esc(t)}<span>${n}번</span></li>`).join("")}</ol>`;
  if(helped.length) h += `<p class="sub">나한테 효과 있던 방법</p><ol class="rank">${helped.map(([t,n])=>`<li>${esc(t)}<span>${n}번</span></li>`).join("")}</ol>`;
  const lines = [];
  if(cats.length) lines.push(`요즘은 <b>${esc(CAT[cats[0][0]]?.name||"기타")}</b> 쪽이 가장 자주 나를 눌렀어요.`);
  if(avg!==null) lines.push(`바위 하나를 깨는 데 평균 ${avg<1?"하루도 안":Math.round(avg)+"일"} 걸렸어요.`);
  if(lines.length) h += `<p class="insightline">${lines.join(" ")}</p>`;
  b.innerHTML = h;
}

// ---------- stats view ----------
let period = 30;
document.querySelectorAll(".nav [data-view]").forEach(b => b.onclick = () => {
  const v = b.dataset.view;
  document.querySelectorAll(".nav [data-view]").forEach(x => { x.classList.toggle("on", x===b); x.setAttribute("aria-pressed", x===b); });
  $("vMain").hidden = v !== "main"; $("vStats").hidden = v !== "stats";
  if(v === "stats") renderInsights();
  scrollTo({ top: 0, behavior: "auto" });
});
$("period").querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
  period = Number(b.dataset.p);
  $("period").querySelectorAll("button").forEach(x => x.classList.toggle("on", x===b));
  renderInsights();
});
function renderInsights(){
  if($("vStats").hidden) return;
  const since = period ? Date.now() - period*864e5 : 0;
  const added = state.added.filter(x => x.at >= since);
  const sm = state.smashed.filter(x => x.at >= since);
  const durs = sm.filter(s => s.addedAt).map(s => (s.at - s.addedAt)/864e5);
  const avg = durs.length ? durs.reduce((a,c)=>a+c,0)/durs.length : null;
  const avgTxt = avg === null ? "-" : avg < 1 ? "하루 안" : Math.round(avg) + "일";
  $("sSum").innerHTML = [
    [added.length, "올린 바위"], [sm.length, "깨뜨린 바위"],
    [state.items.length, "지금 남은 바위"], [avgTxt, "깨는 데 평균"]
  ].map(([n,l]) => `<div class="sum"><b>${esc(n)}</b><span>${l}</span></div>`).join("");
  const none = `<p class="empty">이 기간에는 아직 기록이 없어요.</p>`;

  const byCat = Object.entries(countBy(added, x=>x.cat)).sort((a,b)=>b[1]-a[1]);
  if(byCat.length){
    const max = byCat[0][1], tot = added.length;
    let h = byCat.map(([c,n]) => `<div class="stat"><span>${esc(CAT[c]?.name||"기타")}</span><span class="track"><i style="width:${n/max*100}%"></i></span><span class="n">${n}</span></div>`).join("");
    const topCat = CAT[byCat[0][0]]?.name || "기타";
    h += `<p class="insightline"><b>${esc(topCat)}</b> 쪽이 전체의 ${Math.round(byCat[0][1]/tot*100)}%로 가장 많았어요.</p>`;
    $("sCat").innerHTML = h;
  } else $("sCat").innerHTML = none;

  const byText = Object.entries(countBy(added, x=>x.cat+"|"+x.text)).sort((a,b)=>b[1]-a[1]).slice(0,5);
  $("sTop").innerHTML = byText.length ? `<ol class="rank">${byText.map(([k,n]) => { const [c,...t] = k.split("|"); return `<li>${esc(t.join("|"))}<span>${esc(CAT[c]?.name||"기타")} · ${n}번</span></li>`; }).join("")}</ol>` : none;

  if(added.length){
    const order = [1,2,3,4,5,6,0], names = ["일","월","화","수","목","금","토"];
    const cnt = [0,0,0,0,0,0,0]; added.forEach(x => cnt[new Date(x.at).getDay()]++);
    const mx = Math.max(...cnt);
    let h = `<div class="days">${order.map(d => `<div class="${cnt[d]===mx?"max":""}"><em>${cnt[d]||""}</em><i style="height:${cnt[d]/mx*90}%"></i>${names[d]}</div>`).join("")}</div>`;
    const peaks = order.filter(d => cnt[d]===mx).map(d => names[d]+"요일");
    h += `<p class="insightline">${esc(peaks.join(", "))}에 스트레스를 가장 많이 올렸어요.</p>`;
    $("sDay").innerHTML = h;
  } else $("sDay").innerHTML = none;

  const helped = Object.entries(countBy(sm, x=>x.helped)).filter(([k]) => k !== "잘 모르겠어").sort((a,b)=>b[1]-a[1]).slice(0,5);
  $("sHelp").innerHTML = helped.length ? `<ol class="rank">${helped.map(([t,n]) => `<li>${esc(t)}<span>${n}번</span></li>`).join("")}</ol>` : `<p class="empty">바위를 깨고 "뭐가 도움됐어?"에 답하면 여기 쌓여요.</p>`;

  const recent = sm.slice(-10).reverse();
  $("sLog").innerHTML = recent.length ? `<ul class="log">${recent.map(s => { const d = new Date(s.at); return `<li><span class="d">${d.getMonth()+1}/${d.getDate()} · ${esc(CAT[s.cat]?.name||"기타")} · ${LVN[s.level]||""}</span>${esc(s.text)}${s.helped?`<span class="h">도움된 것: ${esc(s.helped)}</span>`:""}</li>`; }).join("")}</ul>` : none;
}

// ---------- actions ----------
function addRock(level){
  const it = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), cat:pending.cat, text:pending.text, level, done:[], hits:0, at:Date.now() };
  state.items.unshift(it);
  state.added.push({ cat:it.cat, text:it.text, level, at:it.at });
  pending = null; sel = it.id; save(); render();
  document.querySelector(".scene").scrollIntoView({ behavior: reduce?"auto":"smooth", block:"start" });
}
function doAction(it, a){
  if(it.done.includes(a)) return;
  if(a === "1분 숨 고르기"){ breathe(() => markDone(it, a)); return; }
  markDone(it, a);
}
function markDone(it, a){
  const was = ready(it);
  it.done.push(a); save();
  render();
  const el = document.querySelector(`.rock.sel`);
  if(el){
    const r = el.getBoundingClientRect();
    chips(r.left+r.width/2, r.top+r.height/2, getComputedStyle(el).backgroundColor, 8);
    el.classList.add("hit");
    if(!was && ready(it) && navigator.vibrate) try{ navigator.vibrate([20,30,20]); }catch(e){}
  }
}
function tapRock(id, el, x, y){
  const it = state.items.find(i=>i.id===id); if(!it) return;
  if(sel !== id){ sel = id; render(); }
  const cur = document.querySelector(`.rock.sel`) || el;
  if(!ready(it)){ cur.classList.remove("wig"); void cur.offsetWidth; cur.classList.add("wig"); $("panel").scrollIntoView({behavior:reduce?"auto":"smooth",block:"nearest"}); return; }
  it.hits++;
  const color = getComputedStyle(cur).backgroundColor;
  if(it.hits >= FINAL_HITS) return smash(it, cur, color);
  cur.classList.remove("hit"); void cur.offsetWidth; cur.classList.add("hit");
  cur.querySelector("svg").innerHTML = cracks(it.id).slice(0,crackCount(it)).map(d=>`<path d="${d}"/>`).join("");
  chips(x, y, color, 8);
  if(navigator.vibrate) try{ navigator.vibrate(15); }catch(e){}
}
function smash(it, el, color){
  const r = el.getBoundingClientRect();
  if(!reduce){
    const n = 30 + it.level*16;
    for(let i=0;i<n;i++){
      const x=r.left+Math.random()*r.width, y=r.top+Math.random()*r.height;
      const ang=Math.atan2(y-(r.top+r.height/2), x-(r.left+r.width/2))+(Math.random()-.5)*.8;
      const sp=4+Math.random()*9+it.level*1.6, sz=8+Math.random()*22;
      parts.push({ x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-6,rot:Math.random()*6,vr:(Math.random()-.5)*.5,
        pts:[[0,-sz*.6],[sz*.5,sz*.4],[-sz*.5,sz*.5]].map(([a,b])=>[a*(.6+Math.random()*.8),b*(.6+Math.random()*.8)]), color, life:1 });
    }
    for(let i=0;i<34;i++){ const a=Math.random()*Math.PI*2, sp=6+Math.random()*12; parts.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,spark:true}); }
    run();
    document.body.classList.remove("shake"); void document.body.offsetWidth; document.body.classList.add("shake");
    if(navigator.vibrate) try{ navigator.vibrate([30,20,70]); }catch(e){}
  }
  el.style.visibility = "hidden";
  const boom = $("boom");
  boom.textContent = ["박살!","와장창!","깨뜨림!","끝!"][Math.floor(Math.random()*4)];
  boom.classList.remove("go"); void boom.offsetWidth; boom.classList.add("go");
  state.items = state.items.filter(x=>x.id!==it.id);
  const rec = { cat:it.cat, text:it.text, level:it.level, addedAt:it.at, at:Date.now(), done:it.done.slice() };
  state.smashed.push(rec); sel = null; save();
  setTimeout(()=>{ render(); const h=$("hero"); h.classList.remove("boing"); void h.getBoundingClientRect(); h.classList.add("boing"); setTimeout(()=>reflect(rec), reduce?150:800); }, reduce?100:450);
}
function reflect(rec){
  const opts = rec.done.concat(["시간이 해결해줬어","잘 모르겠어"]);
  $("rChips").innerHTML = opts.map(o=>`<button class="chip" data-o="${esc(o)}" type="button">${esc(o)}</button>`).join("");
  $("reflect").hidden = false;
  $("rChips").querySelector("button").focus();
  $("rChips").querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{ rec.helped = b.dataset.o; save(); $("reflect").hidden = true; renderInsights(); });
}

// ---------- breathing ----------
let bT = [], bDone = null;
function breathe(onDone){
  bDone = onDone; const c=$("circle"), tx=$("bText");
  $("breathe").hidden = false; $("bSkip").textContent = "그만할래요"; $("bSkip").focus();
  c.className = "circle"; let k = 0;
  const cycle = () => {
    if(k>=6){ tx.textContent = "잘했어요"; $("bSkip").textContent = "다 했어요"; const f=bDone; bDone=null; f&&f(); return; }
    k++; c.className="circle in"; tx.textContent="코로 천천히 들이마시고…";
    bT.push(setTimeout(()=>{ c.className="circle out"; tx.textContent="입으로 길게 내쉬어요"; },4000));
    bT.push(setTimeout(cycle,10000));
  };
  bT.push(setTimeout(cycle,600));
}
$("bSkip").onclick = () => { bT.forEach(clearTimeout); bT=[]; $("breathe").hidden = true; if(bDone && $("circle").className!=="circle"){ const f=bDone; bDone=null; f(); } bDone=null; };

// ---------- particles ----------
const cv=$("fx"), ctx=cv.getContext("2d"); let parts=[], raf=null;
function resize(){ const d=devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; ctx.setTransform(d,0,0,d,0,0); }
addEventListener("resize", resize); resize();
function chips(x,y,color,n){
  if(reduce) return;
  for(let i=0;i<n;i++){ const a=-Math.PI/2+(Math.random()-.5)*2.4, sp=3+Math.random()*6, sz=4+Math.random()*7;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,rot:Math.random()*6,vr:(Math.random()-.5)*.6,pts:[[0,-sz],[sz,sz*.6],[-sz,sz*.7]],color,life:.9}); }
  for(let i=0;i<5;i++){ const a=Math.random()*Math.PI*2, sp=4+Math.random()*5; parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.7,spark:true}); }
  run();
}
function run(){ if(!raf) raf=requestAnimationFrame(tick); }
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p=>p.life>0 && p.y<innerHeight+60);
  for(const p of parts){
    if(p.spark){ p.x+=p.vx; p.y+=p.vy; p.vx*=.9; p.vy*=.9; p.life-=.04;
      ctx.strokeStyle=`rgba(255,210,63,${Math.max(p.life,0)})`; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*2.2,p.y-p.vy*2.2); ctx.stroke(); }
    else { p.vy+=.55; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life-=.009;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.max(p.life,0); ctx.fillStyle=p.color; ctx.strokeStyle="#2B1B3D"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(...p.pts[0]); ctx.lineTo(...p.pts[1]); ctx.lineTo(...p.pts[2]); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
  }
  raf = parts.length ? requestAnimationFrame(tick) : null;
  if(!raf) ctx.clearRect(0,0,innerWidth,innerHeight);
}

render();

// ---------- sync inside Claude ----------
if(window.claude && claude.use){
  (async()=>{ try{
    const [db,user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db||!user) return; const uid = await user.id(); if(!uid) return;
    ref = db.collection("data/users/"+uid).doc("board");
    const d = (await ref.get()).data?.();
    if(d && Array.isArray(d.added)){ state = { items:d.items||[], added:d.added||[], smashed:d.smashed||[] }; render(); }
    else save();
  }catch(e){ ref=null; } })();
}
})();
</script>
