<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘 부수고 자기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#111111; --muted:#6B6B6B; --hair:#E2E2E2; --scene:#F2F2F2;
  --gold:#FF5A1F; --gold-soft:#FFE7DD; --sel:#111111; --on-sel:#FFFFFF;
  --m5:#FF5A1F; --m4:#FF9E7A; --m3:#D9D9D9; --m2:#A8A8A8; --m1:#7A7A7A;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0B; --surface:#0B0B0B; --ink:#F5F5F5; --muted:#A3A3A3; --hair:#2A2A2A; --scene:#1A1A1A;
    --gold-soft:#2A1A12; --sel:#F5F5F5; --on-sel:#0B0B0B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B0B; --surface:#0B0B0B; --ink:#F5F5F5; --muted:#A3A3A3; --hair:#2A2A2A; --scene:#1A1A1A;
  --gold-soft:#2A1A12; --sel:#F5F5F5; --on-sel:#0B0B0B; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.wrap{max-width:500px;margin:0 auto;padding:24px 20px 80px}
.serif{font-family:inherit;font-weight:700}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-weight:700;font-size:1.15rem;margin:0;letter-spacing:-.01em}
.date{color:var(--muted);font-size:.8rem;font-weight:500;letter-spacing:.06em;margin:0}
h2{font-weight:700;font-size:1.85rem;line-height:1.15;margin:0 0 6px;letter-spacing:-.03em}
.lead{color:var(--muted);font-size:.9rem;margin:0 0 20px}
h3{font-size:.76rem;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:20px 0 10px}
button{font:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible,input:focus-visible,.rock:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.card{background:transparent;border:none;border-top:2px solid var(--ink);border-radius:0;padding:16px 0 4px;margin-bottom:16px}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:.92rem;margin:0}

.nav{display:flex;gap:22px;border-bottom:2px solid var(--ink);margin:0 0 24px}
.nav button{border:none;background:none;padding:0 0 10px;font-size:.95rem;font-weight:500;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px}
.nav button.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:700}

.primary{width:100%;font-size:1.02rem;font-weight:700;padding:17px 18px;border:none;border-radius:0;background:var(--gold);color:#111111;text-align:left;display:flex;justify-content:space-between;align-items:center}
.primary::after{content:"→"}
.primary:active{opacity:.85}
.row{display:flex;gap:12px;align-items:center;margin-top:24px}
.row .primary{flex:1}
.back{border:none;background:none;color:var(--ink);font-weight:500;padding:12px 4px;font-size:.92rem}
.linkbtn{border:none;background:none;color:var(--ink);font-weight:500;text-decoration:underline;text-underline-offset:3px;padding:6px 0;font-size:.88rem}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:10px 13px;border:2px solid var(--ink);border-radius:0;background:transparent;font-size:.9rem;font-weight:500;line-height:1.35}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.done{background:var(--ink);color:var(--bg)}
.chip.done::before{content:"✓ ";color:var(--gold)}
.chip.ghost{border-style:dashed;color:var(--muted)}
.chip.sm{padding:5px 9px;font-size:.82rem;border-width:1.5px}
.chip.static{cursor:default}
.chip.plan{border-color:var(--gold)}
.tabs{display:flex;gap:18px;overflow-x:auto;margin:0 0 14px;scrollbar-width:none;border-bottom:2px solid var(--hair)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:0 0 8px;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;background:none;color:var(--muted);font-size:.9rem;font-weight:500}
.tab.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:700}
.picked{margin:0 0 16px;font-size:.88rem;color:var(--muted)}
.picked b{color:var(--ink);font-weight:700}
.own{display:flex;gap:6px;margin-top:12px}
.own input,.memo{flex:1;min-width:0;border:2px solid var(--ink);border-radius:0;padding:11px 12px;font:inherit;background:transparent;color:var(--ink)}
.own button{padding:9px 16px;border:none;border-radius:0;background:var(--ink);color:var(--bg);font-weight:700}
.memo{width:100%}

.progress{display:block;height:6px;background:var(--hair);margin:0 0 24px}
.progress i{display:block;height:100%;background:var(--gold);transition:width .4s}
.moods{display:flex;flex-direction:column;gap:6px}
.mood{display:flex;align-items:center;gap:14px;padding:16px;border:2px solid var(--ink);border-radius:0;background:transparent;font-size:1rem;font-weight:500;text-align:left}
.mood .dot{width:16px;height:16px;border-radius:0;flex:none}
.mood.on{background:var(--ink);color:var(--bg)}

/* scene */
.scene{position:relative;border-radius:0;overflow:hidden;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:52px 14px 0;margin-bottom:16px;background:var(--scene);color:var(--ink)}
.scene .say{position:absolute;top:16px;left:16px;right:16px;margin:0;font-weight:700;font-size:.95rem;color:var(--ink)}
.moon,.stars{display:none}
.stack{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%}
.horizon{position:relative;z-index:1;width:calc(100% + 28px);height:20px;background:var(--ink);margin-top:-2px}
.rock{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 20px;margin-top:-6px;color:#FFFFFF;font-size:.86rem;font-weight:700;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere;line-height:1.35}
.rock.l1{width:min(54%,210px);min-height:56px}
.rock.l2{width:min(68%,270px);min-height:68px}
.rock.l3{width:min(82%,320px);min-height:80px}
.rock .shape{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.rock.glass{color:#111111}
.rock.small{width:min(44%,170px);min-height:42px;font-size:.78rem;cursor:default}
.rock:nth-child(odd){transform:rotate(-1deg)} .rock:nth-child(even){transform:rotate(1.5deg) translateX(5px)}
.rock.wob{animation:wob .3s}
@keyframes wob{0%,100%{translate:0 0}25%{translate:-3px 0}75%{translate:3px 0}}
.rock.hit{animation:hit .12s}
@keyframes hit{0%{translate:0 0}40%{translate:-4px 2px}70%{translate:3px -1px}100%{translate:0 0}}
.rock span{position:relative;z-index:2;pointer-events:none}
.rock svg.ck{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
.rock svg.ck path{fill:none;stroke:#FFFFFF;stroke-width:2.4;stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
.caption{position:absolute;left:0;right:0;bottom:34px;z-index:3;text-align:center;font-weight:700;color:var(--ink);font-size:1.1rem;opacity:0;pointer-events:none}
.caption.go{animation:cap 1.6s ease forwards}
@keyframes cap{0%{opacity:0;transform:translateY(6px)}20%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

/* panel */
.panel h4{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.bar{height:6px;background:var(--hair);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.note{font-size:.84rem;color:var(--muted);margin:0}
.callout{margin:14px 0 0;padding:12px 14px;background:var(--gold);color:#111111;font-weight:700;font-size:.9rem}
.plan{margin:10px 0 0;font-size:.86rem;font-weight:700;color:var(--ink)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:2px solid var(--hair)}
.carrybox{margin-top:12px}

/* summary */
.sumhead{display:flex;align-items:center;gap:12px}
.sumhead .dot{width:20px;height:20px;border-radius:0;flex:none}
.sumhead b{font-size:1.3rem;letter-spacing:-.02em}
.memoq{color:var(--muted);margin:8px 0 0}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calhead b{font-size:1.2rem;letter-spacing:-.02em}
.calhead button{border:2px solid var(--ink);background:transparent;border-radius:0;width:40px;height:36px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:.74rem;font-weight:700;color:var(--muted);padding-bottom:4px}
.cal button{aspect-ratio:1;border:none;border-radius:0;background:var(--hair);font-size:.82rem;font-weight:500;padding:0;color:var(--muted);position:relative}
.cal button.has{color:#111111;font-weight:700}
.cal button.today::after{content:"";position:absolute;inset:0;border:2px solid var(--ink)}
.cal button.sel{outline:3px solid var(--gold);outline-offset:-3px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px}

/* stats */
.seg{display:inline-flex;border:2px solid var(--ink);margin:0 0 16px}
.seg button{padding:7px 16px;border:none;border-radius:0;background:transparent;font-size:.86rem;font-weight:500;color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg)}
.sumgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin-bottom:16px;border-top:2px solid var(--ink)}
.sum{background:transparent;border:none;border-bottom:2px solid var(--hair);border-radius:0;padding:14px 4px}
.sum b{display:block;font-size:2rem;font-weight:700;letter-spacing:-.04em;line-height:1.1}
.sum span{font-size:.78rem;font-weight:500;color:var(--muted)}
.sum .dot{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:middle}
.stat{display:grid;grid-template-columns:5.4em 1fr 1.8em;align-items:center;gap:10px;margin-bottom:10px;font-size:.88rem}
.stat .track{height:10px;background:var(--hair);overflow:hidden}
.stat .track i{display:block;height:100%;background:var(--ink)}
.stat .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.rank{margin:0;padding:0;list-style:none;counter-reset:r}
.rank li{counter-increment:r;display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1.5px solid var(--hair);font-size:.92rem}
.rank li:last-child{border-bottom:none}
.rank li::before{content:counter(r);font-weight:700;color:var(--gold);width:1em}
.rank li span{margin-left:auto;color:var(--muted);font-size:.82rem}
.insight{margin:16px 0 0;padding:12px 14px;background:var(--ink);color:var(--bg);font-weight:500;font-size:.94rem}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px}
.days div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:.76rem;font-weight:500;color:var(--muted)}
.days i{width:100%;min-height:4px}
.help{font-size:.78rem;color:var(--muted);margin-top:34px;line-height:1.6}

/* breathe */
.ov{position:fixed;inset:0;z-index:70;background:#111111;color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:24px;text-align:center}
.ov[hidden]{display:none}
.ov p{margin:0;font-weight:700;font-size:1.15rem}
.ring{width:190px;height:190px;border-radius:50%;border:4px solid #FF5A1F;transform:scale(.5)}
.ring.in{transition:transform 4s ease-in-out;transform:scale(1)}
.ring.out{transition:transform 6s ease-in-out;transform:scale(.5)}
.ov button{border:2px solid #FFFFFF;background:transparent;color:#FFFFFF;border-radius:0;padding:10px 18px;font-size:.9rem;font-weight:500}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.rock.hit,.rock.wob{animation:none}.caption.go{animation-duration:.01s}}

/* ===== simple ===== */
.list{display:flex;flex-direction:column;margin-top:4px}
.item{border-top:2px solid var(--ink);padding:14px 0 16px;display:flex;flex-direction:column;gap:10px}
.item:last-child{border-bottom:2px solid var(--ink)}
.ihead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ititle{font-size:1.1rem;font-weight:700;letter-spacing:-.02em;word-break:keep-all;overflow-wrap:anywhere}
.ifoot{display:flex;gap:6px}
.fbtn{flex:1;padding:11px 8px;border:2px solid var(--ink);border-radius:0;background:transparent;font-weight:700;font-size:.92rem}
.fbtn.on{background:var(--ink);color:var(--bg)}
.item.gone .ititle{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.item.later .ititle{color:var(--muted)}
.item.anim{animation:settle .3s ease}
@keyframes settle{from{opacity:.35}to{opacity:1}}
.donebox{padding:26px 0 20px;border-top:2px solid var(--ink);margin-bottom:6px}
.donebox .big{font-size:2rem;font-weight:700;letter-spacing:-.03em;margin:0 0 6px}
@media (prefers-reduced-motion:reduce){.item.anim{animation:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="ov" id="breathe" hidden role="dialog" aria-modal="true" aria-label="숨 고르기">
  <p>1분 숨 고르기</p>
  <div class="ring" id="ring"></div>
  <p id="bText" style="font-size:.95rem;opacity:.8">원을 따라 천천히</p>
  <button id="bSkip" type="button">그만할래요</button>
</div>
<main class="wrap">
  <header><h1>오늘 부수고 자기</h1><p class="date" id="date"></p></header>
  <nav class="nav" aria-label="메뉴">
    <button type="button" class="on" data-view="today" aria-pressed="true">오늘</button>
    <button type="button" data-view="cal" aria-pressed="false">기록</button>
    <button type="button" data-view="stats" aria-pressed="false">통계</button>
  </nav>
  <section id="vToday"></section>
  <section id="vCal" hidden></section>
  <section id="vStats" hidden></section>
  <p class="help">많이 힘든 날엔 혼자 버티지 말고 믿는 사람이나 전문가와 이야기해 보세요.<br>자살예방상담전화 109 · 정신건강위기상담 1577-0199</p>
</main>

<script>
(() => {
// ================= data =================
const MOODS = [
  {v:5, name:"아주 좋았어", c:"var(--m5)"},
  {v:4, name:"좋았어", c:"var(--m4)"},
  {v:3, name:"그럭저럭", c:"var(--m3)"},
  {v:2, name:"별로였어", c:"var(--m2)"},
  {v:1, name:"힘들었어", c:"var(--m1)"}
];
const MOOD = Object.fromEntries(MOODS.map(m=>[m.v,m]));
const DID = ["일했어","공부했어","운동했어","산책했어","친구 만났어","가족이랑 보냈어","데이트했어","집안일 했어","푹 쉬었어","취미 생활","맛있는 거 먹었어","영상·게임","늦잠 잤어","야근했어","병원 다녀왔어","쇼핑했어"];
const CATS = [
 {id:"work", name:"일·공부", s:{
  "마감이 코앞":["뼈대만 먼저 잡았어","쉬운 부분부터 조금 했어","기한 조정을 물어봤어","내일 할 분량을 정했어"],
  "할 일이 너무 많아":["할 일을 다 적어봤어","꼭 할 3개만 골랐어","안 해도 될 일을 지웠어"],
  "발표·시험":["한 번 연습해봤어","예상 질문을 적어봤어","일찍 자기로 했어"],
  "실수했어":["바로잡을 걸 하나 했어","관련된 사람에게 알렸어","다음엔 어떻게 할지 정했어"],
  "일이 손에 안 잡혀":["15분만 해보자며 시작했어","자리를 정리했어","휴대폰을 멀리 뒀어"],
  "회의가 많았어":["회의 사이에 잠깐 쉬었어","내일 일정을 정리했어","불필요한 회의를 줄여봤어"]}},
 {id:"rel", name:"관계", s:{
  "눈치 보이는 사람":["바꿀 수 있는 것만 구분했어","할 말을 짧게 정리했어","믿는 사람에게 얘기했어"],
  "서운한 일":["서운한 점을 한 문장으로 적었어","말할지 넘길지 정했어","한발 물러서 생각해봤어"],
  "다퉜어":["먼저 마음을 가라앉혔어","상대 입장도 생각해봤어","먼저 연락해봤어"],
  "연락이 부담돼":["답장을 미뤄도 된다고 정했어","짧게라도 답했어","알림을 잠시 껐어"],
  "외로웠어":["편한 사람에게 연락했어","밖에 나가 걸었어","좋아하는 걸 했어"],
  "무례한 사람":["내 잘못이 아니라고 정리했어","거리를 두기로 했어","누군가에게 털어놨어"]}},
 {id:"body", name:"몸·컨디션", s:{
  "잠을 못 잤어":["잠깐 낮잠을 잤어","오늘 일찍 눕기로 했어","오후 카페인을 끊었어"],
  "너무 피곤해":["물을 충분히 마셨어","잠깐 걸었어","할 일을 하나 덜어냈어"],
  "몸이 안 좋아":["쉬어도 된다고 허락했어","병원·약을 챙겼어","따뜻한 걸 먹었어"],
  "운동을 못 했어":["짧게 스트레칭했어","계단으로 다녔어","내일 운동 시간을 정했어"],
  "과식했어":["가볍게 산책했어","나를 탓하지 않기로 했어","내일 식사를 미리 정했어"]}},
 {id:"money", name:"돈", s:{
  "카드값·지출":["이번 달 지출을 확인했어","줄일 항목을 하나 정했어","장바구니를 비웠어"],
  "수입 걱정":["고정 지출을 적어봤어","필요한 금액을 숫자로 정했어","상의할 사람을 찾아봤어"],
  "갚아야 할 돈":["갚을 날짜와 금액을 정리했어","상대에게 일정을 알렸어","이번 달 가능한 만큼 정했어"],
  "충동구매":["반품할지 정했어","하루 기다리기 규칙을 만들었어","쇼핑 앱 알림을 껐어"]}},
 {id:"future", name:"미래·불안", s:{
  "진로 고민":["고민을 다 적어봤어","궁금한 걸 하나 알아봤어","먼저 가본 사람에게 물어봤어"],

function rng(seed){ let h=2166136261; for(const c of seed){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%10000)/10000; }; }
function cracks(id){ const r=rng(id), out=[]; for(let i=0;i<9;i++){ let x=35+r()*30,y=35+r()*30,a=r()*Math.PI*2,d=`M${x.toFixed(1)} ${y.toFixed(1)}`; const n=3+Math.floor(r()*3); for(let k=0;k<n;k++){ a+=(r()-.5)*1.1; const L=8+r()*12; x+=Math.cos(a)*L; y+=Math.sin(a)*L; d+=` L${x.toFixed(1)} ${y.toFixed(1)}`; } out.push(d); } return out; }
const lvOf = t => 1 + Math.floor(rng(t)()*3);
const PAL = {facet:["#2B2F39","#7C8290"], glass:["#6F889E","#DCE8F0"]};
const PARTC = {rock:["#6E717E","#4A4C57","#8C8F9B"], facet:["#222222","#555555","#FF5A1F"], glass:["#FFFFFF","#111111","#FF5A1F"]};
function mix(a,b,t){ const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)); const A=p(a),B=p(b); return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join(""); }
function styleOf(){ return "rock"; }
function rockShape(id, style){
  const r = rng(id+"ast"), n = 12, pts = [];
  for(let i=0;i<n;i++){ const a=i/n*Math.PI*2+(r()-.5)*.35, k=.86+r()*.16; pts.push([50+Math.cos(a)*48*k, 20+Math.sin(a)*19*k]); }
  const P = arr => arr.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const t = Math.floor(r()*3), base = ["#4A4C57","#55515A","#4E5560"][t], lite = ["#7A7D8A","#86808C","#7B8490"][t], dark = "#2E3037";
  const lit = pts.map(([x,y]) => [50+(x-50)*.84-4, 20+(y-20)*.78-3]);
  let craters = "";
  for(let i=0;i<3;i++){ const cx=24+r()*52, cy=11+r()*18, rx=3+r()*6, ry=rx*.75;
    craters += `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="${dark}"/><path d="M${(cx-rx).toFixed(1)} ${cy.toFixed(1)} A${rx.toFixed(1)} ${ry.toFixed(1)} 0 0 0 ${(cx+rx).toFixed(1)} ${cy.toFixed(1)}" fill="none" stroke="${lite}" stroke-width="1" style="vector-effect:non-scaling-stroke"/>`; }
  return `<svg class="shape" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><polygon class="body" points="${P(pts)}" fill="${base}"/><polygon points="${P(lit)}" fill="${lite}" opacity=".5"/>${craters}</svg>`;
}
function smallRock(c, style){ return `<div class="rock small l${lvOf(c.text)}${style==="glass"?" glass":""}">${rockShape(c.text, style)}<span>${esc(c.text)}</span></div>`; }
function moonStyle(load){ const dim = Math.min(load*0.16, 0.7); return `filter:brightness(${1-dim}) saturate(${1-dim*0.6});opacity:${1-dim*0.5}`; }

function toggle(arr, v){ const i = arr.indexOf(v); i<0 ? arr.push(v) : arr.splice(i,1); }
function hasStress(c,t){ return draft.stress.some(s=>s.cat===c && s.text===t); }
function renderStressStep(el){

  const tabs = (fav.length?[{id:"fav",name:"자주 고른 것"}]:[]).concat(CATS);
  if(!tabs.some(t=>t.id===tab)) tab = fav.length ? "fav" : "work";
  const list = tab==="fav" ? fav : Object.keys(CAT[tab].s).map(t=>({cat:tab,text:t}));
  el.innerHTML = progress() + `<h2>오늘 나를 누른 것</h2><p class="lead">있었던 걸 모두 골라요</p>

    <div class="tabs" role="tablist">${tabs.map(t=>`<button class="tab${tab===t.id?" on":""}" role="tab" aria-selected="${tab===t.id}" data-tab="${t.id}" type="button">${esc(t.name)}</button>`).join("")}</div>
    <div class="chips">${list.map(x=>`<button class="chip${hasStress(x.cat,x.text)?" on":""}" data-c="${esc(x.cat)}" data-t="${esc(x.text)}" type="button" aria-pressed="${hasStress(x.cat,x.text)}">${esc(x.text)}</button>`).join("")}
      ${tab!=="fav" ? `<button class="chip ghost" id="ownBtn" type="button">직접 쓰기</button>` : ""}</div>
    ${ownOpen ? `<div class="own"><input id="ownIn" maxlength="30" placeholder="짧게 적어요"><button id="ownOk" type="button">추가</button></div>` : ""}
    <div class="row"><button class="back" id="prev" type="button">이전</button><button class="primary" id="next" type="button">${draft.stress.length ? "다음" : "오늘은 없었어요"}</button></div>`;

  el.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    const c = b.dataset.c, t = b.dataset.t, i = draft.stress.findIndex(s=>s.cat===c && s.text===t);

let justIdx = -1;
function renderRitual(el){
  const total = rocks.length, decided = rocks.filter(r=>r.fate).length;
  if(!total){ finishDay(); return; }
  el.innerHTML = progress() + `<h2>오늘 것 정리하기</h2><p class="lead">해본 걸 체크하고, 내려놓을지 내일로 넘길지 골라요</p>

    <div class="row"><button class="back" id="prev" type="button">이전</button><button class="primary" id="done" type="button">${decided<total ? "나머지 내려놓고 완료" : "정리 완료"}</button></div>`;
  justIdx = -1;
  el.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const r = rocks[+b.dataset.i], a = b.dataset.a, j = r.acts.indexOf(a);
    if(j >= 0){ r.acts.splice(j,1); renderToday(); return; }
    if(a === "1분 숨 고르기"){ breathe(() => { r.acts.push(a); renderToday(); }); return; }

    </div></div>`;
}
const FXN = {zoom:"줌아웃", hole:"블랙홀", dust:"별가루"};
function fxMode(){ return S.fx || "zoom"; }
function release(el, lv, done){
  const m = fxMode();
  if(m === "hole"){ suck(el, 0); setTimeout(done, reduce?200:1600); return; }
  if(m === "zoom"){ shrink(el); setTimeout(done, reduce?250:1800); return; }
  shatter(el, lv); setTimeout(done, reduce?150:1000);
}
function holeEl(){ let h = document.querySelector("#scene .bh"); if(!h){ h = document.createElement("div"); h.className = "bh"; $("scene").appendChild(h); } return h; }
function suck(el, delay){
  const h = holeEl(), hr = h.getBoundingClientRect(), r = el.getBoundingClientRect();
  if(reduce){ el.style.opacity = "0"; return; }
  const dx = hr.left+hr.width/2-(r.left+r.width/2), dy = hr.top+hr.height/2-(r.top+r.height/2);
  el.style.animation = "none";
  const a = el.animate([{transform:"translate(0,0) scale(1) rotate(0deg)",opacity:1},{transform:`translate(${dx*.55}px,${dy*.55}px) scale(.7,.4) rotate(90deg)`,opacity:1,offset:.55},{transform:`translate(${dx}px,${dy}px) scale(0) rotate(270deg)`,opacity:0}],{duration:1200,delay,easing:"cubic-bezier(.55,0,.85,.4)",fill:"forwards"});
  a.onfinish = () => { h.animate([{transform:"translate(-50%,-50%) scale(1)"},{transform:"translate(-50%,-50%) scale(1.25)"},{transform:"translate(-50%,-50%) scale(1)"}],{duration:320}); if(navigator.vibrate) try{ navigator.vibrate(25); }catch(e){} };
}
function shrink(el){
  if(reduce){ el.style.opacity = "0"; return; }
  el.style.animation = "none";
  el.animate([{transform:"scale(1)",opacity:1},{transform:"scale(.035)",opacity:1,offset:.8},{transform:"scale(.02)",opacity:0}],{duration:1500,easing:"cubic-bezier(.6,0,.2,1)",fill:"forwards"});
  const e = document.querySelector("#scene .horizon"); if(e) e.animate([{transform:"scale(1)"},{transform:"scale(.82)"},{transform:"scale(1)"}],{duration:1600,easing:"ease-in-out"});
  const st = document.querySelector("#scene .stars"); if(st) st.animate([{transform:"scale(1)"},{transform:"scale(.75)"},{transform:"scale(1)"}],{duration:1600,easing:"ease-in-out"});
}
function zoomAll(els, done){
  const scene = $("scene"), stack = $("stack"), earth = scene.querySelector(".horizon"), stars = scene.querySelector(".stars");
  if(reduce){ els.forEach(e => e.style.opacity = "0"); setTimeout(done, 400); return; }
  const dur = 3400;
  els.forEach(e => e.style.animation = "none");
  stack.style.transformOrigin = "50% 100%";
  stack.animate([{transform:"scale(1)",opacity:1},{transform:"scale(.02)",opacity:1,offset:.5},{transform:"scale(.01)",opacity:0}],{duration:dur*.7,easing:"cubic-bezier(.6,0,.3,1)",fill:"forwards"});
  earth.animate([{transform:"translateY(0) scale(1)",opacity:1},{transform:"translateY(-90px) scale(.03)",opacity:1,offset:.75},{transform:"translateY(-90px) scale(.01)",opacity:0}],{duration:dur,easing:"cubic-bezier(.5,0,.3,1)",fill:"forwards"});
  stars.animate([{transform:"scale(1)"},{transform:"scale(.45)"}],{duration:dur,easing:"cubic-bezier(.5,0,.3,1)",fill:"forwards"});
  ["지구","태양계","우리 은하"].forEach((c,i) => setTimeout(() => caption(c), 250 + i*850));
  setTimeout(done, dur + 900);
}
function releaseAll(left, els, done){
  const m = fxMode();
  if(m === "zoom") return zoomAll(els, done);
  if(m === "hole"){ els.forEach((e,i) => suck(e, i*260)); setTimeout(done, reduce?250:els.length*260+1700); return; }
  const gap = reduce?0:160, lead = reduce?0:350;
  els.forEach((e,i) => setTimeout(() => shatter(e, lvOf(left[i].text)), lead+i*gap));
  setTimeout(done, reduce?200:lead+els.length*gap+1300);
}
function caption(t){ const c = $("caption"); if(!c) return; c.textContent = t; c.classList.remove("go"); void c.offsetWidth; c.classList.add("go"); }
function finishDay(){
  const k = todayKey();
  if(step === 4){
    S.days[k] = { mood:draft.mood, did:draft.did, good:draft.good, memo:draft.memo,
      stress: rocks.map(r => ({cat:r.cat, text:r.text, carried:!!r.carried, acts:r.acts, fate:r.fate||"smashed", plan:r.fate==="carry"?r.plan:null})), at:Date.now() };
    S.carry = rocks.filter(r=>r.fate==="carry").map(r=>({cat:r.cat,text:r.text,from:k,plan:r.plan||null}));

// ---------- breathing ----------
let bT = [], bDone = null, bStarted = false;
function breathe(onDone){
  bDone = onDone; bStarted = false; const c=$("ring"), tx=$("bText");
  $("breathe").hidden = false; $("bSkip").textContent = "그만할래요"; $("bSkip").focus();
  c.className = "ring"; tx.textContent = "원을 따라 천천히"; let k = 0;
  const cycle = () => {
    if(k>=6){ tx.textContent = "잘했어요"; $("bSkip").textContent = "돌아가기"; return; }
    k++; bStarted = true; c.className="ring in"; tx.textContent="코로 천천히 들이마시고";
    bT.push(setTimeout(()=>{ c.className="ring out"; tx.textContent="입으로 길게 내쉬어요"; },4000));
    bT.push(setTimeout(cycle,10000));
  };
  bT.push(setTimeout(cycle,700));
}
$("bSkip").onclick = () => { bT.forEach(clearTimeout); bT=[]; $("breathe").hidden = true; const f = bDone; bDone = null; if(f && bStarted) f(); };

// ================= calendar =================
let calY, calM, calSel = null;
{ const d = parseKey(todayKey()); calY = d.getFullYear(); calM = d.getMonth(); }
function skyHTML(){
  const tk = todayKey(), stars = []; let lines = "";
  Object.keys(S.days).sort().forEach(k => {
    const pts = [];
    (S.days[k].stress||[]).filter(s => s.fate !== "carry").forEach(s => { const r = rng(k+s.text); const p = {x:10+r()*300, y:12+r()*150, r:.8+r()*1.3, today:k===tk}; pts.push(p); stars.push(p); });
    for(let i=1;i<pts.length;i++) lines += `<line x1="${pts[i-1].x.toFixed(1)}" y1="${pts[i-1].y.toFixed(1)}" x2="${pts[i].x.toFixed(1)}" y2="${pts[i].y.toFixed(1)}"/>`;
  });
  const n = stars.length;
  return `<div class="sky"><svg viewBox="0 0 320 180" role="img" aria-label="내려놓은 고민 ${n}개가 별이 된 밤하늘"><g stroke="#8C90A3" stroke-opacity=".4" stroke-width=".6">${lines}</g>${stars.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(p.today?p.r+1:p.r).toFixed(1)}" fill="${p.today?"#FF8A4C":"#ECEAF2"}"/>`).join("")}</svg><div class="skyt"><b>내 밤하늘</b><span>${n ? `별 ${n}개` : "아직 별이 없어요"}</span></div></div>`;
}
function renderCal(){
  const el = $("vCal"), first = new Date(calY, calM, 1), n = new Date(calY, calM+1, 0).getDate(), tk = todayKey();
  let cells = WD.map(w=>`<span class="wd">${w}</span>`).join("");
  for(let i=0;i<first.getDay();i++) cells += `<span></span>`;
  for(let d=1; d<=n; d++){
    const k = `${calY}-${pad(calM+1)}-${pad(d)}`, day = S.days[k];
    cells += `<button type="button" data-k="${k}" class="${day?"has":""}${k===tk?" today":""}${k===calSel?" sel":""}" ${day?`style="background:${MOOD[day.mood]?.c}"`:""} aria-label="${calM+1}월 ${d}일${day?", "+(MOOD[day.mood]?.name||""):""}">${d}</button>`;
  }
  const monthDays = Object.keys(S.days).filter(k=>k.startsWith(`${calY}-${pad(calM+1)}`)).length;
  const sd = calSel && S.days[calSel] ? parseKey(calSel) : null;
  el.innerHTML = `<div class="card"><div class="calhead"><button type="button" id="pm" aria-label="이전 달">‹</button><b>${calY}년 ${calM+1}월</b><button type="button" id="nm" aria-label="다음 달">›</button></div>
    <div class="cal">${cells}</div>
    <div class="legend">${MOODS.map(m=>`<span><i style="background:${m.c}"></i>${m.name}</span>`).join("")}</div>
    <p class="note" style="margin-top:12px">이번 달 ${monthDays}일을 정리했어요</p></div>
    ${sd ? `<p class="muted serif" style="margin:18px 0 8px">${sd.getMonth()+1}월 ${sd.getDate()}일 ${WD[sd.getDay()]}요일</p>` + summaryHTML(S.days[calSel], false) : `<p class="empty" style="text-align:center;margin-top:18px">색이 있는 날을 누르면 그날이 보여요</p>`}`;
  $("pm").onclick = () => { calM--; if(calM<0){calM=11;calY--;} renderCal(); };
  $("nm").onclick = () => { calM++; if(calM>11){calM=0;calY++;} renderCal(); };
  el.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { if(S.days[b.dataset.k]){ calSel = b.dataset.k; renderCal(); } });

// ================= stats =================
let period = 30;
function renderStats(){
  const el = $("vStats"), since = period ? keyOf(new Date(Date.now()-(period-1)*864e5)) : "0";
  const days = Object.entries(S.days).filter(([k])=>k>=since).map(([k,d])=>({k,...d}));
  const seg = `<div class="seg">${[[7,"7일"],[30,"30일"],[0,"전체"]].map(([p,l])=>`<button type="button" data-p="${p}" class="${period===p?"on":""}">${l}</button>`).join("")}</div>`;
  if(!days.length){ el.innerHTML = seg + `<div class="card"><p class="empty">하루 정리가 쌓이면 여기서 나를 알 수 있어요.</p></div>`; bindSeg(); return; }
  const allS = days.flatMap(d=>d.stress), smashed = allS.filter(s=>s.fate!=="carry"), carried = allS.filter(s=>s.fate==="carry").length;
  const avgR = Math.round(days.reduce((a,d)=>a+d.mood,0)/days.length);
  let h = seg + `<div class="sumgrid">
    <div class="sum"><b>${days.length}일</b><span>정리한 날</span></div>
    <div class="sum"><b style="font-size:1.1rem;padding:6px 0 4px">${dot(avgR)}${MOOD[avgR].name}</b><span>평균 기분</span></div>
    <div class="sum"><b>${smashed.length}개</b><span>내려놓은 바위</span></div>
    <div class="sum"><b>${carried}개</b><span>내일로 넘긴 바위</span></div></div>`;

  const mc = countBy(days, d=>d.mood), mmax = Math.max(...Object.values(mc));
  h += `<div class="card"><h2 style="font-size:1.15rem;margin-bottom:14px">기분</h2>${MOODS.map(m=>`<div class="stat"><span>${m.name}</span><span class="track"><i style="width:${(mc[m.v]||0)/mmax*100}%;background:${m.c}"></i></span><span class="n">${mc[m.v]||0}</span></div>`).join("")}</div>`;

  if(allS.length){
    const cc = sorted(countBy(allS, s=>s.cat)), cmax = cc[0][1];
    h += `<div class="card"><h2 style="font-size:1.15rem;margin-bottom:14px">무엇이 나를 눌렀나</h2>${cc.map(([c,n])=>`<div class="stat"><span>${esc(CAT[c]?.name||"기타")}</span><span class="track"><i style="width:${n/cmax*100}%"></i></span><span class="n">${n}</span></div>`).join("")}
      <h3>자주 있었던 것</h3><ol class="rank">${sorted(countBy(allS, s=>s.text)).slice(0,5).map(([t,n])=>`<li>${esc(t)}<span>${n}번</span></li>`).join("")}</ol>
      <p class="insight">${esc(CAT[cc[0][0]]?.name||"기타")} 쪽이 전체의 ${Math.round(cc[0][1]/allS.length*100)}%로 가장 많았어요.</p></div>`;
  }

  const ha = sorted(countBy(smashed.flatMap(s=>(s.acts||[])), x=>x)).slice(0,5);
  if(ha.length) h += `<div class="card"><h2 style="font-size:1.15rem;margin-bottom:6px">나에게 통한 행동</h2><p class="note" style="margin-bottom:10px">실제로 바위를 깨는 데 쓰인 것들</p>
    <ol class="rank">${ha.map(([t,n])=>`<li>${esc(t)}<span>${n}번</span></li>`).join("")}</ol></div>`;

  const goodDays = days.filter(d=>d.mood>=4), hardDays = days.filter(d=>d.mood<=2);
  if(goodDays.length || hardDays.length){
    const gd = sorted(countBy(goodDays.flatMap(d=>d.did), x=>x)).slice(0,3);
    const hd = sorted(countBy(hardDays.flatMap(d=>d.stress), s=>s.text)).slice(0,3);
    h += `<div class="card"><h2 style="font-size:1.15rem;margin-bottom:4px">좋은 날과 힘든 날</h2>
      <h3>기분 좋은 날 자주 한 것</h3>${gd.length?`<ol class="rank">${gd.map(([t,n])=>`<li>${esc(t)}<span>${n}번</span></li>`).join("")}</ol>`:`<p class="empty">아직 기록이 부족해요</p>`}
      <h3>힘든 날 자주 있던 것</h3>${hd.length?`<ol class="rank">${hd.map(([t,n])=>`<li>${esc(t)}<span>${n}번</span></li>`).join("")}</ol>`:`<p class="empty">아직 기록이 부족해요</p>`}
      ${gd.length?`<p class="insight">기분 좋은 날엔 ‘${esc(gd[0][0])}’가 자주 있었어요.</p>`:""}</div>`;
  }

  const sum=[0,0,0,0,0,0,0], cnt=[0,0,0,0,0,0,0];
  days.forEach(d=>{ const w = parseKey(d.k).getDay(); sum[w]+=d.mood; cnt[w]++; });
  const order=[1,2,3,4,5,6,0];
  h += `<div class="card"><h2 style="font-size:1.15rem;margin-bottom:14px">요일별 기분</h2><div class="days">${order.map(w=>{ const a = cnt[w]?sum[w]/cnt[w]:0; return `<div><i style="height:${a/5*90}%;background:${cnt[w]?MOOD[Math.round(a)].c:"transparent"}"></i>${WD[w]}</div>`; }).join("")}</div>`;
  const valid = order.filter(w=>cnt[w]);
  if(valid.length>=3){ const worst = valid.reduce((a,w)=>sum[w]/cnt[w] < sum[a]/cnt[a] ? w : a); h += `<p class="insight">${WD[worst]}요일이 가장 무거운 편이에요.</p>`; }
  h += `</div>`;

  const gc = sorted(countBy(days.flatMap(d=>d.good), x=>x)).slice(0,5);
  if(gc.length) h += `<div class="card"><h2 style="font-size:1.15rem;margin-bottom:6px">내가 자주 잘한 것</h2><ol class="rank">${gc.map(([t,n])=>`<li>${esc(t)}<span>${n}번</span></li>`).join("")}</ol></div>`;
  el.innerHTML = h; bindSeg();
}
function bindSeg(){ $("vStats").querySelectorAll("[data-p]").forEach(b => b.onclick = () => { period = Number(b.dataset.p); renderStats(); }); }

// ================= particles =================
const cv=$("fx"), ctx=cv.getContext("2d"); let parts=[], raf=null;
function resize(){ const d=devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; ctx.setTransform(d,0,0,d,0,0); }
addEventListener("resize", resize); resize();
const STONE = {1:["#8D929F","#5E6371","#454956"],2:["#7A7F8C","#4C5160","#383C47"],3:["#6A6F7C","#3E4250","#2A2D36"]};
function shatter(el, lv){
  const r = el.getBoundingClientRect(), cx = r.left+r.width/2, cy = r.top+r.height/2;
  el.style.transition = "opacity .25s"; el.style.opacity = "0";
  if(reduce) return;
  const cols = PARTC[styleOf()];
  for(let i=0;i<28+lv*10;i++){
    const x=r.left+Math.random()*r.width, y=r.top+Math.random()*r.height;
    const ang=Math.atan2(y-cy, x-cx)+(Math.random()-.5)*.7, sp=2.5+Math.random()*6+lv, sz=5+Math.random()*16;
    parts.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-4,rot:Math.random()*6,vr:(Math.random()-.5)*.35,
      pts:[[0,-sz*.6],[sz*.55,sz*.35],[-sz*.45,sz*.5]].map(([a,b])=>[a*(.6+Math.random()*.8),b*(.6+Math.random()*.8)]),color:cols[Math.floor(Math.random()*3)],life:1});
  }
  dust(cx, cy, 60);
  document.body.animate([{transform:"translate(0,0)"},{transform:"translate(-2px,1px)"},{transform:"translate(2px,-1px)"},{transform:"translate(0,0)"}],{duration:220});
  if(navigator.vibrate) try{ navigator.vibrate([25,30,50]); }catch(e){}
  run();
}
function chipsFX(x,y,lv,n){
  if(reduce) return; const cols = PARTC[styleOf()];
  for(let i=0;i<n;i++){ const a=-Math.PI/2+(Math.random()-.5)*2.2, sp=2+Math.random()*4, sz=3+Math.random()*5; parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,rot:Math.random()*6,vr:(Math.random()-.5)*.4,pts:[[0,-sz],[sz,sz*.6],[-sz,sz*.7]],color:cols[i%3],life:.85}); }
  dust(x,y,8);
}
function dust(x,y,n){
  if(reduce) return;
  const slow = fxMode()==="dust"; for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=.5+Math.random()*(slow?2.4:3.2); parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.6,r:.6+Math.random()*1.6,life:1,decay:slow?.0025+Math.random()*.004:.006+Math.random()*.01,gold:true}); }
  run();
}
function run(){ if(!raf) raf=requestAnimationFrame(tick); }
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p=>p.life>0 && p.y<innerHeight+60);
  for(const p of parts){
    if(p.gold){ p.x+=p.vx; p.y+=p.vy; p.vx*=.97; p.vy=p.vy*.97-.02; p.life-=p.decay;
      ctx.globalAlpha=Math.max(p.life,0); ctx.fillStyle="#FFE3D1"; ctx.shadowColor="rgba(255,170,120,.9)"; ctx.shadowBlur=5;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; }
    else { p.vy+=.42; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.rot+=p.vr; p.life-=.011;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.max(p.life,0); ctx.fillStyle=p.color; ctx.strokeStyle="rgba(0,0,0,0)"; ctx.lineWidth=0;
      ctx.beginPath(); ctx.moveTo(...p.pts[0]); ctx.lineTo(...p.pts[1]); ctx.lineTo(...p.pts[2]); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
  raf = parts.length ? requestAnimationFrame(tick) : null;
  if(!raf) ctx.clearRect(0,0,innerWidth,innerHeight);
}

renderToday();

// ================= auto update (GitHub Pages) =================
const APP_VERSION = "2026-11-02-4";
if(/github\.io$/.test(location.hostname)){
  const check = async () => {
    try{
      const res = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
      const m = (await res.text()).match(/APP_VERSION = "([^"]+)"/);
      if(m && m[1] !== APP_VERSION && step < 0){
        let last = null; try{ last = sessionStorage.getItem("reloadedFor"); }catch(e){}
        if(last !== m[1]){ try{ sessionStorage.setItem("reloadedFor", m[1]); }catch(e){} location.replace(location.pathname + "?v=" + encodeURIComponent(m[1])); }
      }
    }catch(e){}
  };
  check();
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") check(); });
}

// ================= sync inside Claude =================
if(window.claude && claude.use){
  (async()=>{ try{
    const [db,user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db||!user) return; const uid = await user.id(); if(!uid) return;
    ref = db.collection("data/users/"+uid).doc("journal");
    const d = (await ref.get()).data?.();
    if(d && d.days){ S = { days:d.days||{}, carry:d.carry||[] }; if(step<0){ if(view==="today") renderToday(); else if(view==="cal") renderCal(); else renderStats(); } }
    else if(Object.keys(S.days).length) save();
  }catch(e){ ref=null; } })();
}
})();
