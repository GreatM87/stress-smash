<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스트레스 파괴소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E8E4F0; --surface:#F7F5FB; --ink:#2B1B3D; --muted:#6E6280;
  --hot:#FF3D7F; --spark:#FFD23F; --sky:#4C6FFF;
  --t1:#B9A7F2; --t2:#FF8FB5; --t3:#FF3D7F;
  --line:#2B1B3D;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1424; --surface:#251D33; --ink:#F2ECFA; --muted:#A99BBD;
    --t1:#7C67C9; --t2:#D9578A; --t3:#FF3D7F; --line:#F2ECFA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1424; --surface:#251D33; --ink:#F2ECFA; --muted:#A99BBD;
  --t1:#7C67C9; --t2:#D9578A; --t3:#FF3D7F; --line:#F2ECFA; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.6;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 80px}
h1{font-family:"Black Han Sans","Apple SD Gothic Neo",sans-serif;font-weight:400;font-size:clamp(2.6rem,12vw,3.6rem);line-height:.95;margin:0 0 6px;letter-spacing:-.01em}
h1 .crack{display:inline-block;transform:rotate(-4deg) translateY(2px);color:var(--hot)}
.lede{color:var(--muted);margin:0 0 26px}
.counter{display:flex;align-items:baseline;gap:10px;margin:0 0 22px}
.counter b{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:2.4rem;line-height:1;color:var(--hot)}
.counter span{color:var(--muted)}

form{background:var(--surface);border:2.5px solid var(--line);border-radius:18px;padding:16px;box-shadow:5px 5px 0 var(--line);margin-bottom:30px}
label.q{display:block;font-weight:700;margin-bottom:8px}
textarea{width:100%;min-height:70px;resize:vertical;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--ink)}
.weight{display:flex;gap:8px;margin:12px 0 14px;flex-wrap:wrap}
.weight input{position:absolute;opacity:0;pointer-events:none}
.weight label{flex:1;min-width:88px;text-align:center;padding:8px 6px;border:2px solid var(--line);border-radius:999px;cursor:pointer;font-size:.92rem;user-select:none}
.weight input:checked+label{background:var(--ink);color:var(--surface)}
.weight input:focus-visible+label{outline:3px solid var(--sky);outline-offset:2px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.add{width:100%;font-family:"Black Han Sans",sans-serif;font-size:1.25rem;padding:12px;border:2.5px solid var(--line);border-radius:12px;background:var(--spark);color:#2B1B3D}
.add:active{transform:translate(2px,2px)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

h2{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:1.5rem;margin:0 0 14px}
.pile{display:flex;flex-direction:column;gap:16px}
.empty{color:var(--muted);border:2px dashed var(--muted);border-radius:16px;padding:22px;text-align:center}

.block{position:relative;border:2.5px solid #2B1B3D;border-radius:10px 18px 12px 16px;padding:16px 16px 12px;color:#2B1B3D;box-shadow:6px 6px 0 var(--line)}
.block.l1{background:var(--t1)}
.block.l2{background:var(--t2);transform:rotate(-.6deg)}
.block.l3{background:var(--t3);color:#fff;transform:rotate(.7deg)}
.block .text{font-size:1.12rem;font-weight:700;word-break:keep-all;overflow-wrap:anywhere;margin:0 0 4px;white-space:pre-wrap}
.block .meta{font-size:.85rem;opacity:.8;margin:0 0 12px}
.block .acts{display:flex;gap:8px;flex-wrap:wrap}
.smash{font-family:"Black Han Sans",sans-serif;font-size:1.05rem;padding:9px 16px;border:2.5px solid #2B1B3D;border-radius:10px;background:#2B1B3D;color:var(--spark)}
.tipbtn{padding:9px 14px;border:2px solid currentColor;border-radius:10px;background:transparent;color:inherit;font-size:.95rem}
.del{margin-left:auto;padding:9px 10px;border:none;background:transparent;color:inherit;opacity:.7;font-size:.88rem;text-decoration:underline}
.tips{margin-top:14px;background:var(--surface);color:var(--ink);border:2px solid #2B1B3D;border-radius:12px;padding:12px 14px;font-size:.98rem}
.tips ol{margin:0;padding-left:1.3em}
.tips li{margin-bottom:8px}
.tips li strong{display:block}
.tips .note{color:var(--muted);font-size:.85rem;margin:8px 0 0}
.block.gone{visibility:hidden}

.history{margin-top:40px}
.history ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.history li{font-size:.9rem;padding:4px 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--muted);color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.status{font-size:.82rem;color:var(--muted);margin-top:30px}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.boom{position:fixed;left:50%;top:42%;z-index:60;pointer-events:none;font-family:"Black Han Sans",sans-serif;font-size:clamp(3rem,16vw,5.5rem);color:var(--spark);-webkit-text-stroke:3px #2B1B3D;transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0;white-space:nowrap}
.boom.go{animation:boom 1s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes boom{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(-5deg)}75%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-5deg)}100%{opacity:0;transform:translate(-50%,-62%) scale(1) rotate(-5deg)}}
.shake{animation:shake .35s linear}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.boom.go{animation-duration:.01s}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="boom" id="boom">박살!</div>
<main class="wrap" id="app">
  <h1>스트레스<br><span class="crack">파괴소</span></h1>
  <p class="lede">신경 쓰이는 걸 벽돌처럼 쌓아두고, 해결되면 직접 부숴버리세요.</p>
  <p class="counter"><b id="count">0</b><span>개 부숨</span></p>

  <form id="form" autocomplete="off">
    <label class="q" for="txt">지금 뭐가 스트레스예요?</label>
    <textarea id="txt" maxlength="200" placeholder="예: 금요일까지 보고서 마감"></textarea>
    <div class="weight" role="radiogroup" aria-label="무게">
      <input type="radio" name="lv" id="lv1" value="1"><label for="lv1">살짝 거슬림</label>
      <input type="radio" name="lv" id="lv2" value="2" checked><label for="lv2">꽤 무거움</label>
      <input type="radio" name="lv" id="lv3" value="3"><label for="lv3">짓눌림</label>
    </div>
    <button class="add" type="submit">벽돌로 쌓기</button>
  </form>

  <h2>쌓인 스트레스</h2>
  <div class="pile" id="pile"></div>

  <section class="history" id="historyWrap" hidden>
    <h2>부순 것들</h2>
    <ul id="history"></ul>
  </section>
  <p class="status" id="status"></p>
</main>

<script>
(() => {
  const LV = {1:"살짝 거슬림",2:"꽤 무거움",3:"짓눌림"};
  const FALLBACK = [
    {t:"쪼개서 첫 걸음만 정하기", d:"전체 말고 10분 안에 끝낼 수 있는 다음 행동 하나만 적고 바로 해보세요."},
    {t:"통제할 수 있는 것과 없는 것 나누기", d:"내가 바꿀 수 있는 부분에만 에너지를 쓰고, 나머지는 일단 내려놓아요."},
    {t:"몸부터 풀기", d:"천천히 숨을 길게 내쉬는 호흡을 몇 번 하거나, 10분 걸으면 긴장이 한결 줄어요."},
    {t:"누군가에게 털어놓기", d:"믿는 사람에게 말로 꺼내기만 해도 크기가 작아지는 경우가 많아요."}
  ];
  let state = { items: [], smashed: [] };
  let ref = null, sample = null;
  const $ = id => document.getElementById(id);
  const pile = $("pile"), statusEl = $("status");

  // ---------- storage ----------
  const LS = "stress-smash-v1";
  function loadLocal(){ try{ const v = localStorage.getItem(LS); if(v) state = JSON.parse(v); }catch(e){} }
  function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
  let saveTimer = null;
  function save(){
    saveLocal();
    if(!ref) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      ref.set({ items: state.items, smashed: state.smashed.slice(-60) })
        .catch(() => { statusEl.textContent = "저장이 잠시 안 됐어요. 이 기기에는 남아 있어요."; });
    }, 400);
  }
  loadLocal();

  // ---------- render ----------
  function render(){
    $("count").textContent = state.smashed.length;
    pile.innerHTML = "";
    if(!state.items.length){
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "아직 쌓인 게 없어요. 위에 하나 적어보세요.";
      pile.appendChild(e);
    }
    state.items.forEach(it => pile.appendChild(blockEl(it)));
    const hw = $("historyWrap"), h = $("history");
    hw.hidden = !state.smashed.length;
    h.innerHTML = "";
    state.smashed.slice(-30).reverse().forEach(s => {
      const li = document.createElement("li"); li.textContent = s.text; h.appendChild(li);
    });
  }

  function blockEl(it){
    const b = document.createElement("article");
    b.className = "block l" + it.level;
    b.dataset.id = it.id;
    const p = document.createElement("p"); p.className = "text"; p.textContent = it.text;
    const m = document.createElement("p"); m.className = "meta"; m.textContent = LV[it.level];
    const acts = document.createElement("div"); acts.className = "acts";
    const s = document.createElement("button"); s.type="button"; s.className="smash"; s.textContent="해결! 부수기";
    s.onclick = () => smash(it.id, b);
    const t = document.createElement("button"); t.type="button"; t.className="tipbtn"; t.textContent="이겨내는 방법";
    const box = document.createElement("div"); box.className="tips"; box.hidden = true;
    t.onclick = () => toggleTips(it, box, t);
    const d = document.createElement("button"); d.type="button"; d.className="del"; d.textContent="빼기";
    d.onclick = () => { state.items = state.items.filter(x => x.id !== it.id); save(); render(); };
    acts.append(s, t, d);
    b.append(p, m, acts, box);
    return b;
  }

  // ---------- add ----------
  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const text = $("txt").value.trim();
    if(!text){ $("txt").focus(); return; }
    const level = Number(document.querySelector('input[name="lv"]:checked').value);
    state.items.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), text, level, at: Date.now() });
    $("txt").value = "";
    save(); render();
  });

  // ---------- tips ----------
  function showList(box, list, note){
    box.innerHTML = "";
    const ol = document.createElement("ol");
    list.forEach(x => {
      const li = document.createElement("li");
      const st = document.createElement("strong"); st.textContent = x.t;
      const sp = document.createElement("span"); sp.textContent = x.d;
      li.append(st, sp); ol.appendChild(li);
    });
    box.appendChild(ol);
    if(note){ const n = document.createElement("p"); n.className="note"; n.textContent = note; box.appendChild(n); }
  }
  async function toggleTips(it, box, btn){
    if(!box.hidden){ box.hidden = true; btn.textContent = "이겨내는 방법"; return; }
    box.hidden = false; btn.textContent = "접기";
    if(it.tips){ showList(box, it.tips); return; }
    if(!sample){ showList(box, FALLBACK, "누구에게나 통하는 기본 방법이에요."); return; }
    box.textContent = "이 스트레스에 맞는 방법을 생각하는 중…";
    try{
      const prompt = `사용자가 다음 스트레스를 적었습니다: "${it.text}" (강도: ${LV[it.level]}).
이 상황에 맞춘, 오늘 바로 해볼 수 있는 구체적이고 현실적인 대처법 3가지를 한국어로 따뜻하지만 간결하게 제안하세요.
의학적 진단은 하지 마세요. 내용이 자해나 극단적 위기를 암시하면 첫 항목으로 믿을 만한 사람이나 전문가(한국: 자살예방상담전화 109)에 연락하길 권하세요.
오직 JSON 배열만 출력: [{"t":"짧은 제목","d":"한두 문장 설명"}, ...]`;
      let tips = await sample.json(prompt, { modelTier: "quick" });
      if(!Array.isArray(tips) || !tips.length) throw {code:"bad"};
      tips = tips.slice(0,4).map(x => ({ t: String(x.t||""), d: String(x.d||"") }));
      it.tips = tips; save();
      showList(box, tips);
    }catch(e){
      showList(box, FALLBACK, e && e.code === "rate_limited" ? "요청이 많아 기본 방법을 보여드려요. 잠시 후 다시 눌러보세요." : "맞춤 제안을 못 받아와서 기본 방법을 보여드려요.");
    }
  }

  // ---------- smash FX ----------
  const cv = $("fx"), ctx = cv.getContext("2d");
  let parts = [], raf = null;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function resize(){ const r = devicePixelRatio||1; cv.width = innerWidth*r; cv.height = innerHeight*r; ctx.setTransform(r,0,0,r,0,0); }
  addEventListener("resize", resize); resize();

  function smash(id, el){
    const it = state.items.find(x => x.id === id);
    if(!it) return;
    const r = el.getBoundingClientRect();
    const color = getComputedStyle(el).backgroundColor;
    if(!reduce){
      const n = 26 + it.level * 14;
      for(let i=0;i<n;i++){
        const x = r.left + Math.random()*r.width, y = r.top + Math.random()*r.height;
        const cx = r.left + r.width/2, cy = r.top + r.height/2;
        const ang = Math.atan2(y-cy, x-cx) + (Math.random()-.5)*.8;
        const sp = 4 + Math.random()*9 + it.level*1.5;
        const sz = 8 + Math.random()*22;
        parts.push({ x, y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp - 6, rot: Math.random()*6, vr:(Math.random()-.5)*.5,
          pts: [[0,-sz*.6],[sz*.5,sz*.4],[-sz*.5,sz*.5]].map(([a,b])=>[a*(.6+Math.random()*.8), b*(.6+Math.random()*.8)]),
          color, life: 1, spark:false });
      }
      for(let i=0;i<30;i++){
        const a = Math.random()*Math.PI*2, sp = 6+Math.random()*12;
        parts.push({ x:r.left+r.width/2, y:r.top+r.height/2, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, spark:true });
      }
      if(!raf) raf = requestAnimationFrame(tick);
      document.body.classList.remove("shake"); void document.body.offsetWidth; document.body.classList.add("shake");
      if(navigator.vibrate) try{ navigator.vibrate([30,20,60]); }catch(e){}
    }
    el.classList.add("gone");
    const boom = $("boom");
    boom.textContent = ["박살!","와장창!","끝!","부숴버림!"][Math.floor(Math.random()*4)];
    boom.classList.remove("go"); void boom.offsetWidth; boom.classList.add("go");
    setTimeout(() => {
      state.items = state.items.filter(x => x.id !== id);
      state.smashed.push({ text: it.text, at: Date.now() });
      save(); render();
    }, reduce ? 200 : 650);
  }

  function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 60);
    for(const p of parts){
      if(p.spark){
        p.x += p.vx; p.y += p.vy; p.vx *= .92; p.vy *= .92; p.life -= .035;
        ctx.strokeStyle = `rgba(255,210,63,${Math.max(p.life,0)})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x - p.vx*2.2, p.y - p.vy*2.2); ctx.stroke();
      } else {
        p.vy += .55; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vx *= .99; p.life -= .008;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(p.life,0);
        ctx.fillStyle = p.color; ctx.strokeStyle = "#2B1B3D"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(...p.pts[0]); ctx.lineTo(...p.pts[1]); ctx.lineTo(...p.pts[2]); ctx.closePath();
        ctx.fill(); ctx.stroke(); ctx.restore();
      }
    }
    raf = parts.length ? requestAnimationFrame(tick) : null;
    if(!raf) ctx.clearRect(0,0,innerWidth,innerHeight);
  }

  render();

  // ---------- capabilities (light up when available) ----------
  (async () => {
    if(!window.claude || !claude.use) return;
    try{ sample = await claude.use("sample"); }catch(e){ sample = null; }
  })();
  (async () => {
    if(!window.claude || !claude.use) return;
    try{
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if(!db || !user) return;
      const uid = await user.id();
      if(!uid) return;
      ref = db.collection("data/users/" + uid).doc("board");
      const snap = await ref.get();
      const d = snap.data && snap.data();
      if(d && Array.isArray(d.items)){
        state = { items: d.items, smashed: Array.isArray(d.smashed) ? d.smashed : [] };
        saveLocal(); render();
      } else if(state.items.length || state.smashed.length){
        save();
      }
    }catch(e){ ref = null; }
  })();
})();
</script>
</body>
</html>
